<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="三分心">
<meta name="theme-color" content="#e6e0f0">
<meta name="mobile-web-app-capable" content="yes">
<title>三分心 · 超短篇小说工作台 v2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%239a8cb8'/%3E%3Ctext x='50' y='58' font-size='24' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E4%B8%89%E5%88%86%E5%BF%83%3C/text%3E%3C/svg%3E">
<style>
/* ===== 淡紫色系柔和配色 ===== */
:root{
  --c-bg:#f4f0f8;
  --c-bg-soft:#ece5f5;
  --c-purple-50:#f3eff8;
  --c-purple-100:#e8e0f2;
  --c-purple-200:#d5c9e8;
  --c-purple-300:#b9a8d8;
  --c-purple-500:#9a8cb8;
  --c-purple-600:#7b6d9e;
  --c-purple-700:#5d4f85;
  --c-accent-50:#f5f0f8;
  --c-accent-100:#ebe0f0;
  --c-accent-200:#dcc8e8;
  --c-accent-300:#c4a8d8;
  --c-accent-500:#a888c0;
  --c-accent-600:#8b6aa8;
  --c-card:#faf8fc;
  --c-text:#4a4060;
  --c-text-light:#6e6480;
  --c-text-muted:#968ca5;
  --c-border:#e0d8ea;
  --c-border-soft:#ede5f5;
  --c-shadow:0 2px 8px rgba(120,100,160,0.06),0 1px 3px rgba(0,0,0,0.03);
  --c-shadow-hover:0 6px 20px rgba(120,100,160,0.10),0 2px 6px rgba(0,0,0,0.04);
  --radius:16px;
  --radius-sm:10px;
  --radius-xs:8px;
  --nav-w:84px;
  --nav-w-active:260px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:linear-gradient(135deg,#f4f0f8 0%,#ece5f5 100%);
  color:var(--c-text);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none;}
button{cursor:pointer;}
input,textarea{width:100%;}
ul{list-style:none;}

/* ===== 布局 ===== */
.app{display:flex;height:100dvh;height:100vh;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);}

/* 左侧导航 */
.sidebar{
  width:var(--nav-w);
  flex-shrink:0;
  background:linear-gradient(180deg,#ece5f5 0%,#e6ddf0 100%);
  border-right:1px solid var(--c-border-soft);
  display:flex;
  flex-direction:column;
  transition:width .3s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
  position:relative;
  z-index:20;
}
.sidebar.expanded{width:var(--nav-w-active);}
.brand{
  padding:18px 14px 14px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.5);
  min-height:68px;
  flex-shrink:0;
}
.brand-logo{
  width:52px;height:52px;border-radius:12px;
  background:linear-gradient(135deg,#9a8cb8,#7b6d9e);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:11px;font-weight:700;
  flex-shrink:0;
  box-shadow:0 3px 8px rgba(120,100,160,.3);
}
.brand-text{white-space:nowrap;overflow:hidden;}
.brand-title{font-size:17px;font-weight:600;color:#3d3650;letter-spacing:.5px;}
.brand-sub{font-size:11px;color:var(--c-text-muted);margin-top:2px;}

.nav-list{flex:1;overflow-y:auto;padding:10px 8px;-webkit-overflow-scrolling:touch;}
.nav-list::-webkit-scrollbar{width:0;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 12px;border-radius:var(--radius-sm);
  color:var(--c-text-light);
  margin-bottom:4px;
  transition:all .2s;
  white-space:nowrap;overflow:hidden;
  position:relative;
}
.nav-item .nav-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:18px;
  background:rgba(255,255,255,.6);
  transition:all .2s;
}
.nav-item .nav-label{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;}
.nav-item.active{background:rgba(255,255,255,.85);color:#3d3650;font-weight:500;box-shadow:0 2px 8px rgba(120,100,160,.08);}
.nav-item.active .nav-icon{background:linear-gradient(135deg,#d5c9e8,#c4a8d8);color:#3d3650;}
.nav-item:active{background:rgba(255,255,255,.6);}
.nav-item.active::before{
  content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:3px;background:linear-gradient(180deg,#9a8cb8,#8b6aa8);
}

.sidebar-footer{
  padding:10px 8px;border-top:1px solid rgba(255,255,255,.5);
  flex-shrink:0;display:flex;flex-direction:column;
}
.nav-export{padding:10px 12px;gap:12px;margin-bottom:4px;color:var(--c-text-light);font-size:13px;white-space:nowrap;overflow:hidden;}
.nav-export .nav-icon{background:rgba(255,255,255,.5);}
.nav-export:active{background:rgba(255,255,255,.5);}
.nav-export::before{display:none !important;}

/* 右侧内容 */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0;}
.header{
  padding:14px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--c-border-soft);
  flex-shrink:0;
  z-index:5;
}
.header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.header-menu-btn{
  display:none;width:36px;height:36px;border-radius:10px;
  align-items:center;justify-content:center;
  background:rgba(255,255,255,.6);color:var(--c-text);
  font-size:20px;flex-shrink:0;
}
.header h1{font-size:18px;font-weight:600;color:#3d3650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-date{font-size:12px;color:var(--c-text-muted);margin-top:2px;}
.header-right{display:flex;gap:8px;flex-shrink:0;}
.header-tag{
  padding:4px 10px;border-radius:20px;font-size:11px;
  background:var(--c-accent-100);color:#5d4f85;
}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--c-purple-200);border-radius:4px;}

/* ===== 卡片 ===== */
.card{
  background:var(--c-card);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--c-shadow);
  border:1px solid rgba(224,216,234,.5);
}
.card-title{
  font-size:15px;font-weight:600;color:#3d3650;
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
}
.card-title .dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#9a8cb8,#8b6aa8);}

/* ===== 输入区 ===== */
.input-group{margin-bottom:12px;}
.input-group label{display:block;font-size:13px;color:var(--c-text-light);margin-bottom:6px;font-weight:500;}
.input-group input,.input-group textarea,.input-group select{
  width:100%;padding:10px 12px;border-radius:var(--radius-sm);
  background:var(--c-purple-50);border:1px solid var(--c-border-soft);
  font-size:14px;
}
.input-group input:focus,.input-group textarea:focus,.input-group select:focus{
  border-color:var(--c-purple-300);background:#fff;
}
.input-group textarea{resize:vertical;min-height:80px;line-height:1.6;}

.btn{
  padding:10px 16px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:500;transition:all .2s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{
  background:linear-gradient(135deg,#9a8cb8,#7b6d9e);color:#fff;
  box-shadow:0 3px 8px rgba(120,100,160,.2);
}
.btn-primary:active{transform:scale(.97);}
.btn-accent{
  background:linear-gradient(135deg,#c4a8d8,#8b6aa8);color:#fff;
  box-shadow:0 3px 8px rgba(139,106,168,.2);
}
.btn-accent:active{transform:scale(.97);}
.btn-ghost{
  background:var(--c-purple-50);color:var(--c-purple-600);
  border:1px solid var(--c-purple-100);
}
.btn-ghost:active{background:var(--c-purple-100);}
.btn-block{width:100%;}
.btn-row{display:flex;gap:8px;margin-top:8px;}
.btn-row .btn{flex:1;}

/* ===== 统计卡 ===== */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-mini{
  background:var(--c-card);border-radius:var(--radius-sm);padding:12px 8px;
  text-align:center;box-shadow:var(--c-shadow);
  border:1px solid rgba(224,216,234,.4);
}
.stat-mini .num{font-size:22px;font-weight:700;color:#7b6d9e;line-height:1.2;}
.stat-mini .num.green{color:#6a9e7b;}
.stat-mini .num.warm{color:#a87860;}
.stat-mini .label{font-size:11px;color:var(--c-text-muted);margin-top:4px;}

/* ===== 灵感卡片 ===== */
.inspo-card{
  background:var(--c-card);border-radius:var(--radius);padding:14px;
  margin-bottom:10px;box-shadow:var(--c-shadow);
  border-left:3px solid var(--c-purple-300);
}
.inspo-card .i-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.inspo-card .i-type{
  padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;
}
.inspo-card .i-type.character{background:#f0e8f8;color:#7b6d9e;}
.inspo-card .i-type.scene{background:#e8f0f8;color:#6d8b9e;}
.inspo-card .i-type.visual{background:#e8f5ee;color:#6a9e7b;}
.inspo-card .i-type.plot{background:#f8f0e8;color:#a87860;}
.inspo-card .i-type.other{background:#f3f0f8;color:#6e6480;}
.inspo-card .i-content{font-size:13px;line-height:1.8;color:var(--c-text);white-space:pre-wrap;word-break:break-word;}
.inspo-card .i-date{font-size:11px;color:var(--c-text-muted);margin-top:6px;}
.inspo-card .i-del{
  width:28px;height:28px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  color:var(--c-text-muted);font-size:16px;flex-shrink:0;
  opacity:.5;
}
.inspo-card .i-del:active{background:rgba(200,150,150,.15);color:#b57373;opacity:1;}

/* ===== 随笔卡片 ===== */
.essay-card{
  background:var(--c-card);border-radius:var(--radius);padding:14px;
  margin-bottom:10px;box-shadow:var(--c-shadow);
  border-top:3px solid var(--c-purple-300);cursor:pointer;
  transition:all .2s;
}
.essay-card:active{box-shadow:var(--c-shadow-hover);transform:translateY(-1px);}
.essay-card .e-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.essay-card .e-title{font-size:14px;font-weight:600;color:#3d3650;flex:1;}
.essay-card .e-source{font-size:11px;color:var(--c-text-muted);}
.essay-card .e-preview{
  font-size:12px;color:var(--c-text-light);line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  font-style:italic;margin-bottom:6px;
}
.essay-card .e-tags{display:flex;flex-wrap:wrap;gap:4px;}
.essay-card .e-tag{padding:2px 8px;border-radius:10px;font-size:10px;background:var(--c-purple-50);color:var(--c-purple-600);}
.essay-card .e-expand{text-align:center;font-size:12px;color:var(--c-text-muted);padding-top:4px;}

/* ===== 分析报告弹层 ===== */
.report-panel{
  background:var(--c-card);border-radius:var(--radius);padding:0;
  margin-bottom:12px;box-shadow:var(--c-shadow-hover);
  border:1px solid var(--c-border-soft);overflow:hidden;
  max-height:0;opacity:0;transition:max-height .5s ease,opacity .3s,padding .3s;
}
.report-panel.open{max-height:5000px;opacity:1;padding:18px;}
.report-panel .rp-title{font-size:15px;font-weight:600;color:#3d3650;margin-bottom:4px;}
.report-panel .rp-subtitle{font-size:12px;color:var(--c-text-muted);margin-bottom:16px;}
.report-section{margin-bottom:16px;}
.report-section h4{
  font-size:13px;font-weight:600;color:var(--c-purple-600);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.report-section h4::before{content:'';display:inline-block;width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,#9a8cb8,#8b6aa8);}
.report-section .rs-content{
  font-size:13px;line-height:1.8;color:var(--c-text);
  padding:10px 12px;background:var(--c-purple-50);border-radius:var(--radius-sm);
}
.report-section .rs-content ul{margin:4px 0;padding-left:18px;}
.report-section .rs-content li{margin-bottom:4px;list-style-type:disc;}
.structure-block{
  background:var(--c-accent-50);border-radius:var(--radius-sm);padding:12px;
  margin-bottom:8px;border-left:3px solid var(--c-accent-300);
}
.structure-block .s-label{font-size:11px;font-weight:600;color:var(--c-purple-600);margin-bottom:4px;}
.structure-block .s-text{font-size:12px;color:var(--c-text);line-height:1.7;}
.rp-close{
  float:right;width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--c-text-muted);font-size:16px;background:var(--c-purple-50);
}
.rp-close:active{background:var(--c-purple-100);color:#b57373;}

/* ===== 数据复盘卡片 ===== */
.data-card{
  background:var(--c-card);border-radius:var(--radius);padding:14px;
  margin-bottom:12px;box-shadow:var(--c-shadow);
  border-top:3px solid var(--c-purple-300);
}
.data-card .d-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.data-card .d-title{font-size:14px;font-weight:600;color:#3d3650;}
.data-card .d-date{font-size:11px;color:var(--c-text-muted);}
.data-card .d-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.data-card .d-stat{text-align:center;padding:8px 4px;background:var(--c-purple-50);border-radius:8px;}
.data-card .d-stat .num{font-size:16px;font-weight:700;color:#7b6d9e;}
.data-card .d-stat .num.green{color:#6a9e7b;}
.data-card .d-stat .num.red{color:#b57373;}
.data-card .d-stat .label{font-size:10px;color:var(--c-text-muted);margin-top:2px;}
.data-card .d-analysis{padding:10px 12px;background:var(--c-accent-50);border-radius:8px;border-left:3px solid var(--c-accent-300);}
.data-card .d-analysis .a-title{font-size:12px;font-weight:600;color:var(--c-purple-600);margin-bottom:4px;}
.data-card .d-analysis .a-text{font-size:13px;color:var(--c-text);line-height:1.7;}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:40px 20px;color:var(--c-text-muted);}
.empty .icon{font-size:40px;margin-bottom:10px;opacity:.5;}
.empty .text{font-size:13px;}

/* ===== Toast ===== */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:rgba(61,54,80,.92);color:#fff;padding:10px 20px;border-radius:24px;
  font-size:13px;z-index:9999;transition:transform .3s;
  backdrop-filter:blur(10px);max-width:90%;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ===== 提醒弹窗 ===== */
.reminder-modal{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;
}
.reminder-modal.show{opacity:1;pointer-events:auto;}
.reminder-body{
  background:var(--c-card);border-radius:var(--radius);padding:24px 20px;
  width:90%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.15);
  text-align:center;
}
.reminder-body h3{font-size:17px;color:#3d3650;margin-bottom:8px;}
.reminder-body p{font-size:13px;color:var(--c-text-light);line-height:1.7;margin-bottom:16px;}
.reminder-body .reminder-actions{display:flex;gap:8px;}
.reminder-body .reminder-actions button{flex:1;}
.reminder-body .reminder-actions .skip{background:var(--c-purple-50);color:var(--c-text-muted);padding:10px;border-radius:var(--radius-sm);font-size:13px;}
.reminder-body .reminder-actions .do{background:linear-gradient(135deg,#9a8cb8,#7b6d9e);color:#fff;padding:10px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;}
.reminder-body .reminder-actions .do:active{transform:scale(.97);}
.reminder-body .reminder-actions .later{background:var(--c-purple-100);color:var(--c-purple-600);padding:10px;border-radius:var(--radius-sm);font-size:13px;}

/* ===== 移动端适配 ===== */
@media (max-width:768px){
  :root{--nav-w:64px;--nav-w-active:240px;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100dvh;height:100vh;z-index:30;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
  .sidebar.show{transform:translateX(0);}
  .sidebar.expanded{width:var(--nav-w-active);}
  .header-menu-btn{display:flex;}
  .content{padding:12px 12px 20px;}
  .card{padding:14px;}
  .stats-grid{grid-template-columns:repeat(3,1fr);}
  .data-card .d-stats{grid-template-columns:repeat(4,1fr);}
}

@media (min-width:769px){
  .sidebar{position:relative;}
}

/* ===== 加载动画 ===== */
.search-loading{text-align:center;padding:30px;color:var(--c-text-muted);font-size:13px;}
.search-loading .spinner{
  display:inline-block;width:24px;height:24px;border:3px solid var(--c-border-soft);
  border-top-color:var(--c-purple-500);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px;
}
@keyframes spin{to{transform:rotate(360deg);}}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.show{opacity:1;pointer-events:auto;}

/* ===== 灵感模块 v2 样式 ===== */
.inspo-card-v2{background:var(--c-card);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;border:1px solid var(--c-border-soft);transition:box-shadow .2s;}
.inspo-card-v2.analysis-open{border-color:var(--c-purple-300);box-shadow:var(--c-shadow-hover);}
.inspo-row-top{display:flex;align-items:flex-start;gap:10px;}
.inspo-checkbox{flex-shrink:0;margin-top:2px;position:relative;width:20px;height:20px;cursor:pointer;}
.inspo-checkbox input{position:absolute;opacity:0;width:0;height:0;}
.checkmark{position:absolute;top:0;left:0;width:20px;height:20px;border:2px solid var(--c-border);border-radius:6px;background:var(--c-bg);transition:all .2s;display:flex;align-items:center;justify-content:center;}
.inspo-checkbox input:checked~.checkmark{background:var(--c-purple-500);border-color:var(--c-purple-500);}
.inspo-checkbox input:checked~.checkmark::after{content:"\2713";color:#fff;font-size:12px;font-weight:700;}
.inspo-body{flex:1;min-width:0;}
.inspo-meta{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.inspo-source-tag{font-size:11px;color:var(--c-purple-600);background:var(--c-purple-50);padding:2px 8px;border-radius:10px;}
.inspo-text-v2{font-size:13px;line-height:1.7;color:var(--c-text);white-space:pre-wrap;word-break:break-word;}
.inspo-tags-v2{margin-top:6px;font-size:11px;color:var(--c-text-muted);display:flex;flex-wrap:wrap;gap:4px;}
.inspo-actions{display:flex;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--c-border-soft);}

.direction-card:last-child{margin-bottom:0;}
.direction-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.direction-num{font-size:11px;font-weight:700;color:var(--c-accent-500);background:var(--c-accent-100);padding:1px 6px;border-radius:8px;}
.direction-title{font-size:13px;font-weight:600;color:#3d3650;}
.direction-angle{font-size:12px;color:var(--c-text-light);margin-bottom:4px;line-height:1.6;}
.direction-opening{font-size:12px;color:var(--c-accent-600);font-style:italic;padding:6px 10px;background:var(--c-accent-50);border-radius:6px;line-height:1.6;}

.combo-list li::before{content:"\2022";position:absolute;left:2px;color:var(--c-purple-400);font-weight:700;}
.combo-framework{padding:10px 12px;margin-bottom:8px;background:var(--c-card);border-radius:var(--radius-xs);border:1px solid var(--c-border-soft);}
.combo-framework:last-child{margin-bottom:0;}
.combo-framework strong{font-size:13px;color:#3d3650;display:block;margin-bottom:4px;}
.combo-framework p{font-size:12px;color:var(--c-text-light);line-height:1.7;margin:0;}
.chat-panel{margin-top:12px;border:1px solid var(--c-purple-200);border-radius:var(--radius-sm);overflow:hidden;}
.chat-panel-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--c-purple-50);border-bottom:1px solid var(--c-purple-100);}
.chat-panel-title{font-size:13px;font-weight:600;color:var(--c-purple-600);}
.chat-direction-bar{display:flex;gap:4px;padding:8px 10px;background:var(--c-bg);border-bottom:1px solid var(--c-border-soft);}
.chat-dir-btn{flex:1;padding:5px 8px;font-size:12px;border-radius:8px;background:var(--c-card);color:var(--c-text-light);border:1px solid var(--c-border);cursor:pointer;transition:all .2s;}
.chat-dir-btn.active{background:var(--c-purple-500);color:#fff;border-color:var(--c-purple-500);}
.chat-dir-btn:active{transform:scale(.96);}
.chat-messages{max-height:280px;overflow-y:auto;padding:10px 12px;background:var(--c-card);-webkit-overflow-scrolling:touch;}
.chat-empty{text-align:center;color:var(--c-text-muted);font-size:12px;padding:20px 10px;line-height:1.7;}
.chat-msg{margin-bottom:10px;}
.chat-msg:last-child{margin-bottom:0;}
.chat-msg-role{font-size:11px;font-weight:600;margin-bottom:4px;}
.chat-msg.user .chat-msg-role{color:var(--c-purple-600);}
.chat-msg.assistant .chat-msg-role{color:var(--c-accent-600);}

.chat-msg.user .chat-msg-content{background:var(--c-purple-50);border-top-left-radius:2px;}
.chat-msg.assistant .chat-msg-content{background:var(--c-accent-50);border-top-left-radius:2px;}
.chat-typing{color:var(--c-text-muted);font-style:italic;}
.chat-typing .dots{animation:blink 1.4s infinite;}
@keyframes blink{0%,20%{opacity:0}50%{opacity:1}80%,100%{opacity:0}}
.chat-input-row{display:flex;gap:8px;padding:8px 10px;background:var(--c-bg);border-top:1px solid var(--c-border-soft);}
.chat-input{flex:1;padding:8px 12px;font-size:13px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius-xs);color:var(--c-text);}

.chat-send-btn{flex-shrink:0;padding:8px 16px;font-size:13px;border-radius:var(--radius-xs);background:var(--c-purple-500);color:#fff;cursor:pointer;transition:all .2s;}
.chat-send-btn:active{transform:scale(.96);}
.chat-send-btn:disabled{opacity:.5;cursor:not-allowed;}
.insp-settings-card{border:1px solid var(--c-accent-200);}
.trending-cat{cursor:pointer;transition:all .2s;}
.trending-cat:hover{box-shadow:var(--c-shadow-hover);}
.trending-hot{cursor:pointer;transition:all .2s;}
.trending-hot:hover{box-shadow:var(--c-shadow-hover);}

<script>
/* ============================================================
   三分心 · 超短篇小说工作台 v2
   抖音平台 | 超短篇小说创作 | 灵感记录 + AI大纲讨论 + 题材趋势
   数据持久化：localStorage
   ============================================================ */

const Store = {
  prefix:'sanfenxin_',
  get(key,def=null){
    try{const v=localStorage.getItem(this.prefix+key);return v?JSON.parse(v):def;}catch(e){return def;}
  },
  set(key,val){
    try{localStorage.setItem(this.prefix+key,JSON.stringify(val));}catch(e){}
  },
  remove(key){localStorage.removeItem(this.prefix+key);},
  getRaw(key,def=''){try{const v=localStorage.getItem(this.prefix+key);return v||def;}catch(e){return def;}},
  setRaw(key,val){try{localStorage.setItem(this.prefix+key,val);}catch(e){}}
};

const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const formatDateCN=s=>{const[y,m,d]=s.split('-');return `${y}年${m}月${d}日`;};
const weekdayCN=s=>{const d=new Date(s+'T00:00:00');return['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];};
const shiftDate=(s,days)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),2200);
}
function escapeHTML(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ===== Markdown 导出引擎 ===== */
const MDExporter = {
  buildFullMD(){
    const now=new Date();
    const ts=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    let md=`# 三分心 · 超短篇小说工作台 v2 — 数据导出\n\n> 导出时间：${ts}\n\n---\n\n`;

    // 灵感记录（v2 格式）
    md+=`## 💡 灵感记录\n\n`;
    const inspos=Store.get('inspirations_v2',[]);
    for(const i of inspos){
      const dateStr=i.createdAt?formatDateCN(i.createdAt.slice(0,10)):'未知日期';
      md+=`### 📌 ${escapeHTML(i.source||'日常')} — ${dateStr}\n\n`;
      md+=`${i.text}\n\n`;
      if(i.tags&&i.tags.length) md+=`**标签**：${i.tags.map(t=>'#'+t).join(' ')}\n\n`;
      if(i.analysis&&i.analysis.directions){
        md+=`**创意方向**：\n`;
        for(const d of i.analysis.directions){
          md+=`- ${d.title}：${d.angle}\n  > ✍️ ${d.opening}\n`;
        }
        md+=`\n`;
      }
      md+=`---\n\n`;
    }

    // 随笔收藏
    md+=`## 📝 随笔收藏\n\n`;
    const essays=Store.get('essays',[]);
    for(const e of essays){
      md+=`### ${e.title} — ${formatDateCN(e.date)}\n\n`;
      md+=`**来源**：${e.source||'未知'}\n\n`;
      md+=`**原文**：\n> ${e.content.replace(/\n/g,'\n> ')}\n\n`;
      if(e.report){
        md+=`**分析报告**：\n\n`;
        if(e.report.preference) md+=`**写作偏好**：${e.report.preference}\n\n`;
        if(e.report.extends) md+=`**可延伸方向**：\n${e.report.extends.map(x=>`- ${x}`).join('\n')}\n\n`;
        if(e.report.styleAnalysis) md+=`**文笔分析**：${e.report.styleAnalysis}\n\n`;
        if(e.report.structureAnalysis) md+=`**结构分析**：${e.report.structureAnalysis}\n\n`;
      }
      md+=`---\n\n`;
    }

    // 数据复盘
    md+=`## 📊 数据复盘\n\n`;
    const dataItems=Store.get('data_items',[]);
    for(const d of dataItems){
      md+=`### ${d.title} — ${formatDateCN(d.date)}\n\n`;
      md+=`- 点赞：${d.likes} | 评论：${d.comments} | 收藏：${d.saves} | 分享：${d.shares} | 播放量：${d.views}\n\n`;
      for(const a of d.analysis){
        md+=`**💡 ${a.title}**：${a.text}\n\n`;
      }
      md+=`---\n\n`;
    }

    md+=`\n---\n> 由「三分心 · 超短篇小说工作台 v2」自动生成\n`;
    return md;
  },
  download(filename='sanfenxin_backup.md'){
    const md=this.buildFullMD();
    const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
    Store.setRaw('last_export',Date.now().toString());
    return md;
  }
};

/* ===== 每周导出提醒 ===== */
const ExportReminder = {
  shouldRemind(){
    const off=Store.getRaw('reminder_off','')==='1';
    if(off) return false;
    const lastExport=parseInt(Store.getRaw('last_export','0'));
    if(!lastExport) return false;
    const snoozeUntil=parseInt(Store.getRaw('reminder_snooze','0'));
    if(snoozeUntil&&Date.now()<snoozeUntil) return false;
    return (Date.now()-lastExport)/(86400000)>=7;
  },
  show(){document.getElementById('reminderModal').classList.add('show');},
  hide(){document.getElementById('reminderModal').classList.remove('show');},
  exportAndHide(){this.hide();setTimeout(()=>{MDExporter.download();toast('✅ 已导出 Markdown 备份文件');},300);},
  snooze(){Store.setRaw('reminder_snooze',(Date.now()+86400000).toString());this.hide();toast('已推迟，1天后提醒');},
  skip(){this.hide();},
  toggle(){
    const off=Store.getRaw('reminder_off','')==='1';
    if(off){Store.setRaw('reminder_off','0');document.getElementById('reminderIcon').textContent='🔔';document.getElementById('reminderLabel').textContent='每周导出提醒：开';toast('✅ 每周导出提醒已开启');}
    else{Store.setRaw('reminder_off','1');document.getElementById('reminderIcon').textContent='🔕';document.getElementById('reminderLabel').textContent='每周导出提醒：关';toast('已关闭每周导出提醒');}
  },
  updateUI(){
    const off=Store.getRaw('reminder_off','')==='1';
    document.getElementById('reminderIcon').textContent=off?'🔕':'🔔';
    document.getElementById('reminderLabel').textContent=off?'每周导出提醒：关':'每周导出提醒：开';
  },
  init(){
    document.getElementById('reminderExport').onclick=()=>this.exportAndHide();
    document.getElementById('reminderSkip').onclick=()=>this.skip();
    document.getElementById('reminderLater').onclick=()=>this.snooze();
    document.getElementById('reminderModal').onclick=e=>{if(e.target===document.getElementById('reminderModal')) this.hide();};
    document.getElementById('exportReminderBtn').onclick=()=>this.toggle();
    this.updateUI();
    setTimeout(()=>{if(this.shouldRemind()) this.show();},2000);
  }
};

/* ============================================================
   模块1：灵感记录 v2
   功能：延伸分析 / 多选组合 / DeepSeek AI 大纲讨论
   数据持久化：localStorage (sanfenxin_ 前缀)
   ============================================================ */

const InspirationModule = {
  items: [],
  selectedIds: new Set(),
  activeAnalysisId: null,
  comboAnalysisResult: null,

  DIRECTION_RULES: [
    {
      keywords: ['爱','喜欢','暗恋','失恋','分手','初恋','前任','心动','感情','关系','暧昧','表白','思念','忘记','再见','错过'],
      directions: [
        { title: '情感反转', angle: '将甜蜜瞬间变成告别序曲，用倒叙制造情感张力', opening: '他说的那句"晚安"，我后来才明白那是再也不会醒来的意思。' },
        { title: '关系博弈', angle: '亲密关系中的权力角力，表面平静下的暗流涌动', opening: '我们之间的较量，从谁先发早安开始。今天我赢了。' },
        { title: '遗憾清单', angle: '用清单体罗列关系中未曾说出口的话和事', opening: '我列了一张清单：1. 没来得及说的谢谢。2. 没勇气问的问题。3. 那天我应该握住的手。' },
        { title: '第三视角', angle: '从旁观者角度叙述一段感情，保持克制距离', opening: '他们坐在咖啡馆的两端，像两本合上的书，中间隔着一整个书架的距离。' },
        { title: '记忆错位', angle: '两个当事人对同一段关系的记忆完全不同', opening: '她说那是夏天。他坚持说是秋天。而照片上的日期是十二月。' },
      ]
    },
    {
      keywords: ['梦','奇怪','诡异','不记得','密码','地下室','黑暗','声音','门','脚步声','镜子','跟踪','失踪','死亡','消失','规则','第','必须','不能'],
      directions: [
        { title: '悬念递进', angle: '从日常小事引出逐渐失控的异常，每段揭开一层', opening: '第三天，我发现镜子里的自己比我晚了一秒。' },
        { title: '真相倒置', angle: '结尾揭示叙述者才是异常本身，前面的铺垫都是伪装', opening: '他们一直在找我。但我已经在这里生活了七年，没有人发现我不是人。' },
        { title: '规则陷阱', angle: '看似合理的规则背后隐藏着致命漏洞，主角利用漏洞反杀', opening: '规则第三条说"不要回头看"。但没说不能停下来。' },
        { title: '日常裂缝', angle: '在最普通的生活场景中插入一个无法解释的细节', opening: '超市收银员扫码的时候，屏幕上显示的不是商品名，而是一个日期——我的生日。' },
        { title: '群像悬疑', angle: '多角色接力叙事，每个视角揭示一部分真相', opening: '我们有五个人。每个人的手机里都收到了一张照片，照片上是我们在场的其中一个人——已经死了。' },
      ]
    },
    {
      keywords: ['日常','下班','地铁','便利店','窗','街道','周末','吃饭','咖啡','天气','路','回家','灯','电梯','手机','楼下','公交','散步','阳台','邻居','外卖','快递'],
      directions: [
        { title: '日常诗意', angle: '从最平凡的瞬间中提取出令人心动的美', opening: '黄昏六点的公交车上，阳光透过车窗，在每个人的脸上停留了恰好三秒。' },
        { title: '荒诞日常', angle: '把日常行为推向极端，制造荒诞感', opening: '我决定用一周时间只跟外卖员说话。第七天的时候，他问我要不要一起去送外卖。' },
        { title: '陌生人列传', angle: '每天观察一个陌生人，写一篇微型传记', opening: '她每天7:15出现在地铁站，左手拿伞，右手握一杯没喝过的咖啡。我给她写了七个版本的人生。' },
        { title: '城市切片', angle: '截取城市某个瞬间，像拍一张照片一样写作', opening: '这座城市凌晨四点的样子：24小时便利店的灯光、清洁工的扫帚声、一个在路边吐的男人。' },
        { title: '物品叙事', angle: '从一件日常物品出发，串联起关于人的故事', opening: '这把钥匙能开的门已经不在了。但它在我口袋里待了三年，磨成了一个光滑的圆。' },
      ]
    },
    {
      keywords: ['科技','AI','人工智能','机器人','未来','数据','代码','虚拟','现实','程序','算法','芯片','网络','系统','空间','飞船','外星','基因','克隆','穿越','时间','平行','维度','赛博','意识','上传','记忆','永生'],

    { title: '对话叙事', angle: '纯用对话推进故事，用留白让读者想象画面', opening: '"你确定要这么做？""确定。""不后悔？""……再问我就后悔了。"' },
    { title: '物件串联', angle: '一件物品在不同人之间流转，串联起多段人生', opening: '这本二手书里有五个人的笔记。四个人的故事我已经读懂了。第五个人只在第128页写了一个"唉"字。' },
  ],

  init() {
    this.items = Store.get('inspirations_v2', []);
    this.selectedIds = new Set();
    this.activeAnalysisId = null;
    this.comboAnalysisResult = null;
  },

  _matchKeywords(text) {
    const lower = text.toLowerCase();
    let bestMatch = null;
    let bestScore = 0;
    for (const rule of this.DIRECTION_RULES) {
      let score = 0;
      for (const kw of rule.keywords) {
        if (lower.includes(kw)) score++;
      }
      if (score > bestScore) { bestScore = score; bestMatch = rule; }
    }
    return bestScore >= 2 ? bestMatch : null;
  },

  generateAnalysis(text, source, tags) {
    const rule = this._matchKeywords(text + ' ' + (tags || []).join(' '));
    let pool = this.DEFAULT_DIRECTIONS;
    if (rule) {
      pool = [...rule.directions, ...this.DEFAULT_DIRECTIONS.slice(0, 2)];
    }
    const n = 3 + Math.floor(Math.random() * 3);
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    return { directions: shuffled.slice(0, n), generatedAt: new Date().toISOString() };
  },

  add(source, text, tags) {
    if (!text.trim()) return;
    const analysis = this.generateAnalysis(text, source, tags);
    const item = {
      id: uid(),
      text: text.trim(),
      source: source || '日常',
      tags: tags || [],
      createdAt: new Date().toISOString(),
      analysis,
    };
    this.items.unshift(item);
    Store.set('inspirations_v2', this.items);
    this.activeAnalysisId = item.id;
    this.render();
    toast('✅ 灵感已保存，分析已生成');
  },

  del(id) {
    this.items = this.items.filter(x => x.id !== id);
    this.selectedIds.delete(id);
    if (this.activeAnalysisId === id) this.activeAnalysisId = null;
    Store.set('inspirations_v2', this.items);
    this.render();
    toast('已删除');
  },

  toggleAnalysis(id) {
    this.activeAnalysisId = this.activeAnalysisId === id ? null : id;
    this.render();
  },

  toggleSelect(id) {
    if (this.selectedIds.has(id)) { this.selectedIds.delete(id); }
    else { this.selectedIds.add(id); }
    this.render();
  },

  toggleSelectAll() {
    if (this.selectedIds.size === this.items.length) { this.selectedIds.clear(); }
    else { this.selectedIds = new Set(this.items.map(i => i.id)); }
    this.render();
  },

  generateComboAnalysis() {
    const selected = this.items.filter(i => this.selectedIds.has(i.id));
    if (selected.length < 2) { toast('请至少选择 2 条灵感进行组合分析'); return; }
    const allText = selected.map(i => i.text).join(' ');
    const allTags = [...new Set(selected.flatMap(i => i.tags))];
    const allSources = [...new Set(selected.map(i => i.source))];
    const connections = [];
    const rule = this._matchKeywords(allText);
    if (rule) { connections.push(`这些灵感都涉及「${rule.keywords.slice(0, 3).join('、')}」等元素，可以围绕这一核心领域展开叙事。`); }
    if (allTags.length >= 3) { connections.push(`标签交集「${allTags.slice(0, 5).join('、')}」提示你目前关注的方向，可以尝试将这些元素融合进一个故事中。`); }
    if (selected.length >= 3) { connections.push(`多条灵感的组合暗示了一个更大的叙事宇宙——也许每一条灵感都是一个独立角色的故事线，最终汇聚到一个共同事件中。`); }
    connections.push(`从「${allSources.join('、')}」等不同来源获得的灵感可以互补：将不同场景/人物类型的素材融合，往往能产生最独特的化学反应。`);
    const fusions = [
      '将灵感A的人物设定 + 灵感B的场景设定 + 灵感C的核心冲突，构建一个完整的三幕短篇',
      '以灵感A为世界观基底，灵感B为主线情节，灵感C的角色群像点缀其中',
      '提取所有灵感的情感内核，用同一个情感主题串联多个独立场景，做成"片段集锦"式短篇',
      '将各灵感中的"反常元素"提取出来，集中到同一个角色身上，创造一个极度复杂的角色',
    ];
    const frameworks = [
      { title: '多线汇聚', desc: `开头分别展开 ${selected.length} 条线索，每条线索对应一条灵感，中间通过一个共同事件（如一个地点、一个人物、一个日期）将所有人串联起来，结尾揭示这些线索之间的隐藏关联。` },
      { title: '时间交错', desc: `将 ${selected.length} 条灵感分配到不同的时间节点（过去/现在/未来），用非线性叙事让读者在不同时间线中穿梭，逐渐拼凑出完整的故事图景。` },
      { title: '主题变奏', desc: `确定一个核心主题（如"失去"或"重逢"），每条灵感作为这个主题的一个变奏版本，构成一组"同题异构"的微小说合集。` },
    ];
    this.comboAnalysisResult = { connections, fusions, frameworks, selectedCount: selected.length };
    this.render();
  },

  render() {
    const wrap = document.getElementById('content');
    const sources = ['日常', '梦境', '阅读', '影视', '对话', '旅行', '社交媒体', '其他'];
    const activeItem = this.activeAnalysisId ? this.items.find(i => i.id === this.activeAnalysisId) : null;
    let html = '';



    // Input area
    html += `<div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span><span class="dot"></span>记录创作灵感</span>
      </div>
      <div class="input-group"><label>灵感内容</label>
        <textarea id="inspoText" placeholder="记录你的灵感碎片…&#10;&#10;示例：&#10;一个每天凌晨三点起床在便利店打工的年轻女孩，她喜欢在收银台下面藏一本诗集，没人的时候偷偷读两句…" rows="4"></textarea>
      </div>
      <div class="input-group" style="display:flex;gap:10px;">
        <div style="flex:1;"><label>来源</label>
          <select id="inspoSource" style="width:100%;padding:10px 14px;background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius-xs);font-size:14px;color:var(--c-text);">
            ${sources.map(s => `<option value="${s}">${s}</option>`).join('')}
          </select>
        </div>
        <div style="flex:2;"><label>标签（逗号分隔）</label>
          <input type="text" id="inspoTags" placeholder="如：治愈、深夜、孤独、都市" maxlength="100">
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="saveInspo">💾 保存灵感并生成延伸分析</button>
    </div>`;

    // Combo analysis result
    if (this.comboAnalysisResult) {
      const cr = this.comboAnalysisResult;
      html += `<div class="card" style="border:2px solid var(--c-purple-300);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div class="card-title" style="margin-bottom:0;"><span class="dot"></span>🔗 组合分析（${cr.selectedCount}条灵感）</div>
          <button class="i-del" id="closeComboAnalysis" style="cursor:pointer;">✕</button>
        </div>
        <div class="combo-section"><div class="combo-section-title">🔍 关联点</div><ul class="combo-list">${cr.connections.map(c => `<li>${escapeHTML(c)}</li>`).join('')}</ul></div>
        <div class="combo-section"><div class="combo-section-title">💡 融合方向</div><ul class="combo-list">${cr.fusions.map(f => `<li>${escapeHTML(f)}</li>`).join('')}</ul></div>
        <div class="combo-section"><div class="combo-section-title">🏗️ 故事框架建议</div>
          ${cr.frameworks.map(f => `<div class="combo-framework"><strong>${escapeHTML(f.title)}</strong><p>${escapeHTML(f.desc)}</p></div>`).join('')}
        </div>
      </div>`;
    }

    // Inspiration list
    const allSelected = this.items.length > 0 && this.selectedIds.size === this.items.length;
    html += `<div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span><span class="dot"></span>灵感库（${this.items.length}条）</span>
        ${this.items.length > 0 ? `<button class="btn btn-ghost" id="toggleSelectAll" style="padding:4px 10px;font-size:11px;border-radius:14px;">${allSelected ? '取消全选' : '全选'}</button>` : ''}
      </div>`;

    if (this.items.length === 0) {
      html += `<div class="empty"><div class="icon">💡</div><div class="text">还没有灵感记录，记录你的第一个创意碎片吧</div></div>`;
    } else {
      html += this.items.map(i => {
        const isSelected = this.selectedIds.has(i.id);
        const isAnalysisOpen = this.activeAnalysisId === i.id;
        const tagStr = (i.tags || []).map(t => `#${escapeHTML(t)}`).join(' ');
        let card = `<div class="inspo-card-v2 ${isAnalysisOpen ? 'analysis-open' : ''}">
          <div class="inspo-row-top">
            <label class="inspo-checkbox" title="选择此灵感"><input type="checkbox" ${isSelected ? 'checked' : ''} data-select-id="${i.id}"><span class="checkmark"></span></label>
            <div class="inspo-body">
              <div class="inspo-meta">
                <span class="inspo-source-tag">📌 ${escapeHTML(i.source)}</span>
                <span class="inspo-date">${escapeHTML(formatDateCN(i.createdAt.slice(0,10)))}</span>
              </div>
              <div class="inspo-text-v2">${escapeHTML(i.text)}</div>
              ${tagStr ? `<div class="inspo-tags-v2">${tagStr}</div>` : ''}
            </div>
            <button class="i-del" data-del-id="${i.id}" title="删除">✕</button>
          </div>
          <div class="inspo-actions">
            <button class="btn btn-ghost inspo-action-btn" data-analysis-id="${i.id}">${isAnalysisOpen ? '▲ 收起分析' : '📍 展开分析'}</button>

          </div>`;

        if (isAnalysisOpen && i.analysis) {
          const dirs = i.analysis.directions || [];
          card += `<div class="analysis-panel">
            <div class="analysis-panel-title">📍 创意方向（${dirs.length}个）</div>
            ${dirs.map((d, idx) => `<div class="direction-card">
              <div class="direction-header"><span class="direction-num">#${idx + 1}</span><span class="direction-title">${escapeHTML(d.title)}</span></div>
              <div class="direction-angle">${escapeHTML(d.angle)}</div>
              <div class="direction-opening">✍️ ${escapeHTML(d.opening)}</div>
            </div>`).join('')}
          </div>`;

        }

        card += `</div>`;
        return card;
      }).join('');

      if (this.selectedIds.size > 0) {
        html += `<div class="multi-select-bar">
          <span class="multi-select-count">已选 <strong>${this.selectedIds.size}</strong> 条</span>
          <button class="btn btn-accent" id="comboAnalyzeBtn">🔗 组合分析</button>
        </div>`;
      }
    }
    html += `</div>`;
    wrap.innerHTML = html;

    // Event bindings
    document.getElementById('saveInspo').onclick = () => {
      const text = document.getElementById('inspoText').value;
      if (!text.trim()) { toast('请输入灵感内容'); return; }
      const source = document.getElementById('inspoSource').value;
      const tagsStr = document.getElementById('inspoTags').value;
      const tags = tagsStr ? tagsStr.split(/[,，]/).map(t => t.trim()).filter(Boolean) : [];
      this.add(source, text, tags);
      document.getElementById('inspoText').value = '';
      document.getElementById('inspoTags').value = '';
    };
    document.getElementById('inspoText').onkeydown = (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) document.getElementById('saveInspo').click();
    };
    document.querySelectorAll('input[data-select-id]').forEach(cb => {
      cb.onchange = () => this.toggleSelect(cb.dataset.selectId);
    });
    const toggleAllBtn = document.getElementById('toggleSelectAll');
    if (toggleAllBtn) toggleAllBtn.onclick = () => this.toggleSelectAll();
    document.querySelectorAll('button[data-analysis-id]').forEach(btn => {
      btn.onclick = () => this.toggleAnalysis(btn.dataset.analysisId);
    });
    document.querySelectorAll('button[data-del-id]').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); this.del(btn.dataset.delId); };
    });
    const comboBtn = document.getElementById('comboAnalyzeBtn');
    if (comboBtn) comboBtn.onclick = () => this.generateComboAnalysis();
    const closeCombo = document.getElementById('closeComboAnalysis');
    if (closeCombo) { closeCombo.onclick = () => { this.comboAnalysisResult = null; this.render(); }; }
  },
};

const DataModule = {
  items:[],
  history:[],
  init(){this.items=Store.get('data_items',[]);},
  add(title,likes,comments,saves,shares,views){
    const data={likes:+likes||0,comments:+comments||0,saves:+saves||0,shares:+shares||0,views:+views||0};
    const prev=this.items.length>0?this.items[0]:null;
    const analysis=this.analyze(data,prev?{likes:prev.likes,comments:prev.comments,saves:prev.saves,shares:prev.shares,views:prev.views}:null);
    this.items.unshift({id:uid(),title:title.trim(),...data,analysis,date:todayStr(),ts:Date.now()});
    Store.set('data_items',this.items);
    this.render();
  },
  del(id){this.items=this.items.filter(x=>x.id!==id);Store.set('data_items',this.items);this.render();},
  analyze(current,previous){
    const tips=[];
    // 流量分析
    const engagementRate=current.views>0?((current.likes+current.comments+current.saves+current.shares)/current.views*100).toFixed(1):0;

    if(current.views<500){
      tips.push({title:'⚠️ 播放量偏低（<500）',text:'抖音初始流量池在200-500之间。播放量低说明内容没有突破初始流量池。建议：①检查前3秒的"完播率"——开头是否有足够的悬念或情绪钩子 ②检查话题标签是否精准 ③尝试在发布后1小时内主动互动（回复评论、去同类内容下互动）。'});
    }else if(current.views<5000){
      tips.push({title:'📊 播放量中等（500-5000）',text:'内容已突破初始流量池，但未进入更大推荐池。建议：①分析高播放量时段的共性——什么类型的开头、什么情绪调性 ②加强评论区互动，每条评论认真回复 ③尝试在文案结尾加入"引导互动"的句子。'});
    }else{
      tips.push({title:'🔥 播放量较高（>5000）',text:'内容已进入较大流量池。建议：①总结这篇的成功因素，形成可复用的模板 ②趁热度发布同系列下一篇 ③关注粉丝画像，优化后续内容方向。'});
    }

    // 互动率分析
    if(+engagementRate<3){
      tips.push({title:'💬 互动率偏低（<3%）',text:'观众看完就走了，缺少参与感。建议：①在结尾加一个开放式问题 ②尝试"选择题式"互动（"你更喜欢A还是B？"）③使用抖音的投票/评论置顶功能引导讨论。'});
    }else if(+engagementRate<8){
      tips.push({title:'👍 互动率良好（3%-8%）',text:'观众有参与意愿。建议：①分析高互动评论的共同特点 ②对精彩评论进行置顶或回复视频 ③保持当前的互动引导策略。'});
    }else{
      tips.push({title:'🎯 互动率优秀（>8%）',text:'内容引发了强烈共鸣。建议：①收藏评论区的高赞评论，它们是下一篇的选题来源 ②可以围绕评论区最热的话题做续集。'});
    }

    // 收藏/点赞比
    if(current.saves>0&&current.likes>0){
      const ratio=current.saves/current.likes;
      if(ratio>0.8){
        tips.push({title:'📌 高收藏率',text:`收藏/点赞比=${ratio.toFixed(2)}，远超平均。说明内容实用性强，观众想"存下来以后看"。建议：这类内容适合做系列化——"第1期/第2期"的栏目形式。`});
      }else if(ratio<0.2){
        tips.push({title:'📌 收藏率偏低',text:`收藏/点赞比=${ratio.toFixed(2)}。内容可能"好看但不实用"。建议：在随笔中加入可"拿走"的元素——一句金句、一个模板、一个方法。`});
      }
    }

    // 与上一篇对比
    if(previous){
      const viewChange=previous.views>0?((current.views-previous.views)/previous.views*100).toFixed(0):0;
      if(+viewChange>20){
        tips.push({title:'📈 相比上篇增长',text:`播放量提升 ${viewChange}%，数据在向好的方向发展。建议：保持当前的内容策略和发布节奏。`});
      }else if(+viewChange<-20){
        tips.push({title:'📉 相比上篇下滑',text:`播放量下降 ${Math.abs(+viewChange)}%。建议：对比两篇的开头、话题标签、发布时间，找出差异因素进行调整。`});
      }
    }

    if(tips.length===0){
      tips.push({title:'📊 数据表现',text:'整体数据在正常范围。建议持续发布，积累更多数据后再做趋势分析。关键指标：互动率='+engagementRate+'%。'});
    }
    return tips;
  },

    };

    document.querySelectorAll('.i-del[data-del]').forEach(b=>{
      b.onclick=()=>this.del(b.dataset.del);

};

  // ===== 初始化 =====
  init(){
    const saved=Store.get('trending',null);
    if(saved&&saved.dailyTopics&&saved.dailyTopics.length){
      this.data=saved;
    }else{
      this.data=this.buildFreshData();
      Store.set('trending',this.data);
    }
  },

  // 构建全新数据（深拷贝基础数据）
  buildFreshData(){
    const now=new Date();
    const ts=now.toISOString();
    // 深拷贝基础题材，并对热度做±5%微调
    const topics=this.baseTopics.map(cat=>{
      const copy=JSON.parse(JSON.stringify(cat));
      copy.heat=this.jitterHeat(copy.heat);
      return copy;
    });
    return {
      lastUpdate:ts,
      dailyTopics:topics,
      hotCases:[]
    };
  },

  // 热度数字微调（±5%）
  jitterHeat(heatStr){
    // 提取数字部分
    const m=heatStr.match(/([\d.]+)(万\+?)(月活|日活|年增长)?/);
    if(!m) return heatStr;
    const num=parseFloat(m[1]);
    const jittered=num*(1+(Math.random()*0.1-0.05));
    const rounded=Math.round(jittered*10)/10;
    return heatStr.replace(m[1],String(rounded));
  },

  // 趋势百分比微调
  jitterTrend(trendStr){
    const m=trendStr.match(/↑\s*(\d+)%/);
    if(!m) return trendStr;
    const num=parseInt(m[1]);
    const jittered=Math.round(num*(1+(Math.random()*0.1-0.05)));
    return trendStr.replace(m[1],String(jittered));
  },

  // 案例点赞微调
  jitterLikes(likesStr){
    const m=likesStr.match(/([\d.]+)万/);
    if(!m) return likesStr;
    const num=parseFloat(m[1]);
    const jittered=num*(1+(Math.random()*0.06-0.03));
    const rounded=Math.round(jittered*10)/10;
    return `${rounded}万`;
  },

  // ===== 刷新数据 =====
  refreshData(){
    // 微调所有热度、趋势、点赞
    this.data.dailyTopics=this.data.dailyTopics.map(cat=>{
      const copy=JSON.parse(JSON.stringify(cat));
      copy.heat=this.jitterHeat(copy.heat);
      copy.trend=this.jitterTrend(copy.trend);
      copy.examples=copy.examples.map(ex=>{
        const ec=JSON.parse(JSON.stringify(ex));
        ec.likes=this.jitterLikes(ec.likes);
        return ec;
      });
      return copy;
    });
    this.data.lastUpdate=new Date().toISOString();
    // 重新生成爆款和创作启发
    this.data.hotCases=this.pickHotCases();
    Store.set('trending',this.data);
    this.render();
    toast('✅ 热文数据已刷新');
  },

  // 选取本周爆款（3-5个）
  pickHotCases(){
    const all=[];
    for(const cat of this.data.dailyTopics){
      for(const ex of cat.examples){
        all.push({...ex,category:cat.category,categoryIcon:cat.categoryIcon});
      }
    }
    // 随机打乱取前4个
    const shuffled=[...all].sort(()=>Math.random()-0.5);
    return shuffled.slice(0,Math.min(4,all.length));
  },

  // 生成创作启发（2-3个）
  generateInspiration(){
    const pool=[...this.inspireTemplates];
    const picked=[];
    const count=Math.min(3,pool.length);
    for(let i=0;i<count;i++){
      const idx=Math.floor(Math.random()*pool.length);
      picked.push(pool.splice(idx,1)[0]);
    }
    return picked;
  },

  // 格式化更新时间
  formatUpdateTime(){
    if(!this.data||!this.data.lastUpdate) return '未知';
    const d=new Date(this.data.lastUpdate);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  },

  // ===== 切换展开 =====
  toggleCategory(id){
    this.activeCategory=this.activeCategory===id?null:id;
    this.render();
    if(this.activeCategory===id){
      setTimeout(()=>{
        const el=document.querySelector(`[data-cat="${id}"]`);
        if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
      },100);
    }
  },

  toggleCase(idx){
    this.activeCase=this.activeCase===idx?null:idx;
    this.render();
  },

        <div class="trending-cat" data-cat="${cat.id}" style="background:var(--c-purple-50);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;border-left:3px solid var(--c-purple-300);cursor:pointer;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-size:11px;font-weight:600;color:var(--c-text-muted);background:var(--c-purple-100);padding:2px 8px;border-radius:10px;">#${index+1}</span>
            <span style="font-size:20px;">${cat.categoryIcon}</span>
            <span style="font-size:14px;font-weight:600;color:#3d3650;flex:1;">${escapeHTML(cat.category)}</span>
          </div>
          <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;">
            <span style="font-size:11px;color:#7b6d9e;background:#fff;padding:2px 8px;border-radius:8px;">🔥 ${escapeHTML(cat.heat)}</span>
            <span style="font-size:11px;color:#6a9e7b;background:#fff;padding:2px 8px;border-radius:8px;">${escapeHTML(cat.trend)}</span>
          </div>
          <div style="font-size:12px;color:var(--c-text-light);line-height:1.6;margin-top:8px;">${escapeHTML(cat.description)}</div>
          <div style="text-align:center;font-size:12px;color:var(--c-purple-600);margin-top:6px;">${showContent?'▲ 收起':'▼ 展开热门设定与案例'}</div>
        </div>
      `;

      if(showContent){
        html+=`
        <div class="trending-detail" style="background:var(--c-card);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;border:1px solid var(--c-border-soft);">
          <div style="font-size:13px;font-weight:600;color:var(--c-purple-600);margin-bottom:8px;display:flex;align-items:center;gap:6px;">
            📌 热门设定
          </div>
          <div style="margin-bottom:14px;">
            ${cat.settings.map(s=>`
              <div style="padding:8px 10px;background:var(--c-accent-50);border-radius:8px;margin-bottom:6px;border-left:3px solid var(--c-accent-300);">
                <div style="font-size:12px;font-weight:600;color:#5d4f85;">${escapeHTML(s.name)}</div>
                <div style="font-size:12px;color:var(--c-text-light);margin-top:2px;">${escapeHTML(s.detail)}</div>
              </div>
            `).join('')}
          </div>

          <div style="font-size:13px;font-weight:600;color:var(--c-purple-600);margin-bottom:8px;display:flex;align-items:center;gap:6px;">
            📖 高赞案例
          </div>
          <div>
            ${cat.examples.map(ex=>`
              <div style="padding:10px 12px;background:var(--c-purple-50);border-radius:8px;margin-bottom:8px;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;">
                  <div style="font-size:13px;font-weight:600;color:#3d3650;flex:1;">${escapeHTML(ex.title)}</div>
                  <span style="font-size:11px;color:#b57373;background:#fff;padding:2px 8px;border-radius:8px;flex-shrink:0;">👍 ${escapeHTML(ex.likes)}</span>
                </div>
                <div style="font-size:12px;color:var(--c-text-light);line-height:1.7;font-style:italic;margin-bottom:6px;">${escapeHTML(ex.excerpt)}</div>
                <div style="font-size:11px;color:var(--c-purple-600);padding:6px 8px;background:var(--c-accent-50);border-radius:6px;">💡 拆解：${escapeHTML(ex.comment)}</div>
              </div>
            `).join('')}
          </div>
        </div>
        `;
      }
    });

    html+=`</div>`;

    // 本周爆款短篇
    html+=`
      <div class="card">
        <div class="card-title"><span class="dot"></span>🔥 本周爆款短篇</div>
        <div style="font-size:11px;color:var(--c-text-muted);margin-bottom:10px;">每次刷新随机选取4篇高赞案例</div>
    `;

    this.data.hotCases.forEach((c,idx)=>{
      const isOpen=this.activeCase===idx;
      html+=`
        <div class="trending-hot" data-idx="${idx}" style="background:var(--c-purple-50);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--c-accent-300);cursor:pointer;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
            <span style="font-size:16px;">${c.categoryIcon}</span>
            <span style="font-size:10px;color:var(--c-text-muted);background:var(--c-purple-100);padding:2px 6px;border-radius:8px;">${escapeHTML(c.category)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div style="font-size:13px;font-weight:600;color:#3d3650;flex:1;">${escapeHTML(c.title)}</div>
            <span style="font-size:11px;color:#b57373;flex-shrink:0;">👍 ${escapeHTML(c.likes)}</span>
          </div>
          <div style="text-align:center;font-size:11px;color:var(--c-purple-600);margin-top:4px;">${isOpen?'▲ 收起拆解':'▼ 展开拆解'}</div>
        </div>
      `;
      if(isOpen){
        html+=`
        <div style="background:var(--c-card);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;border:1px solid var(--c-border-soft);">
          <div style="font-size:12px;color:var(--c-text-light);line-height:1.7;font-style:italic;margin-bottom:8px;">${escapeHTML(c.excerpt)}</div>
          <div style="font-size:11px;color:var(--c-purple-600);padding:8px 10px;background:var(--c-accent-50);border-radius:6px;">💡 拆解：${escapeHTML(c.comment)}</div>
        </div>
        `;
      }
    });

    html+=`</div>`;

    // 创作启发
    html+=`
      <div class="card">
        <div class="card-title"><span class="dot"></span>💡 创作启发</div>
        <div style="font-size:11px;color:var(--c-text-muted);margin-bottom:10px;">基于当前热文趋势，为你生成创作方向建议</div>
    `;

    inspirations.forEach((ins,idx)=>{
      html+=`
        <div style="padding:12px 14px;background:linear-gradient(135deg,var(--c-purple-50),var(--c-accent-50));border-radius:var(--radius-sm);margin-bottom:8px;border-left:3px solid var(--c-accent-500);">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <span style="font-size:11px;font-weight:600;color:#fff;background:linear-gradient(135deg,#9a8cb8,#7b6d9e);padding:2px 8px;border-radius:8px;">建议 ${idx+1}</span>
            <span style="font-size:11px;color:var(--c-purple-600);">参考题材：${escapeHTML(ins.ref)}</span>
          </div>
          <div style="font-size:13px;font-weight:600;color:#3d3650;margin-bottom:6px;">🎯 ${escapeHTML(ins.dir)}</div>
          <div style="font-size:12px;color:var(--c-text-light);line-height:1.7;padding:8px 10px;background:#fff;border-radius:6px;font-style:italic;">"${escapeHTML(ins.opening)}"</div>
        </div>
      `;
    });

    html+=`</div>`;

    wrap.innerHTML=html;

    // ===== 事件绑定 =====
    document.querySelectorAll('.trending-cat').forEach(el=>{
      el.onclick=()=>this.toggleCategory(el.dataset.cat);
    });

    document.querySelectorAll('.trending-hot').forEach(el=>{
      el.onclick=()=>this.toggleCase(parseInt(el.dataset.idx));
    });

    const refreshBtn=document.getElementById('refreshTrendingBtn');
    if(refreshBtn){
      refreshBtn.onclick=()=>this.refreshData();
    }
  },

  // 兼容旧版调用
  autoShow(){this.render();}
};


/* ===== 模块切换 ===== */
const MODULES={
  inspiration:{title:'灵感记录',render:()=>InspirationModule.render(),tag:'人设 · 场景 · 情节'},
  essay:{title:'随笔收藏',render:()=>EssayModule.render(),tag:'分析 · 拆解 · 学习'},
  data:{title:'数据复盘',render:()=>DataModule.render(),tag:'数据 · 诊断 · 优化'},
  trending:{title:'每日热文',render:()=>TrendingModule.render(),tag:'短篇 · 题材 · 趋势'}
};

let currentModule='inspiration';

function switchModule(name){
  if(!MODULES[name])return;
  currentModule=name;
  document.getElementById('pageTitle').textContent=MODULES[name].title;
  document.getElementById('headerTag').textContent=MODULES[name].tag;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.module===name));
  MODULES[name].render();
  if(window.innerWidth<=768){document.getElementById('sidebar').classList.remove('show');document.getElementById('overlay').classList.remove('show');}
  document.getElementById('content').scrollTop=0;
}

function updateHeaderDate(){
  const d=new Date();
  const w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('headerDate').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${w}`;
}

function setupSidebar(){
  const sidebar=document.getElementById('sidebar');
  const overlay=document.getElementById('overlay');
  const menuBtn=document.getElementById('menuBtn');
  menuBtn.onclick=()=>{sidebar.classList.add('show');overlay.classList.add('show');};
  overlay.onclick=()=>{sidebar.classList.remove('show');overlay.classList.remove('show');};
  document.querySelectorAll('.nav-item').forEach(el=>{if(el.dataset.module)el.onclick=()=>switchModule(el.dataset.module);});
  document.getElementById('exportBtn').onclick=()=>{MDExporter.download();toast('✅ Markdown 备份已下载');};
}

function init(){
  updateHeaderDate();
  setupSidebar();
  InspirationModule.init();
  EssayModule.init();
  DataModule.init();
  TrendingModule.init();
  ExportReminder.init();
  switchModule('inspiration');
  setInterval(()=>{
    const now=new Date();
    const cur=document.getElementById('headerDate').textContent;
    const newStr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
    if(!cur.startsWith(newStr)) updateHeaderDate();
  },60000);
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
