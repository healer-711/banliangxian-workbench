<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="半两闲">
<meta name="theme-color" content="#d4d9d4">
<meta name="mobile-web-app-capable" content="yes">
<title>半两闲 · 读写工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%238ba89b'/%3E%3Ctext x='50' y='58' font-size='26' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E5%8D%8A%E4%B8%A4%E9%97%B2%3C/text%3E%3C/svg%3E">
<style>
/* ===== 全局变量 - 莫兰迪配色 柔和蓝绿灰调 ===== */
:root{
  --c-bg:#e8ece8;
  --c-bg-soft:#dde5dd;
  --c-blue-50:#e3e9e6;
  --c-blue-100:#d1dbd5;
  --c-blue-200:#bcc9c3;
  --c-blue-300:#9bada5;
  --c-blue-500:#7b9489;
  --c-blue-600:#5f7a6e;
  --c-green-50:#e5ebe5;
  --c-green-100:#d3ded3;
  --c-green-200:#bccdb8;
  --c-green-300:#99b296;
  --c-green-500:#7a9a76;
  --c-green-600:#607d5d;
  --c-teal:#8ba89b;
  --c-mint:#9ab5a9;
  --c-card:#f5f6f3;
  --c-text:#4a504c;
  --c-text-light:#6e7771;
  --c-text-muted:#939c96;
  --c-border:#d5dbd6;
  --c-border-soft:#e2e8e3;
  --c-shadow:0 2px 8px rgba(95,122,110,0.06),0 1px 3px rgba(0,0,0,0.03);
  --c-shadow-hover:0 6px 20px rgba(95,122,110,0.10),0 2px 6px rgba(0,0,0,0.04);
  --radius:16px;
  --radius-sm:10px;
  --radius-xs:8px;
  --nav-w:84px;
  --nav-w-active:260px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:linear-gradient(135deg,#e8ece8 0%,#dde5dd 100%);
  color:var(--c-text);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none;}
button{cursor:pointer;}
input,textarea{width:100%;}
ul{list-style:none;}

/* ===== 布局 ===== */
.app{display:flex;height:100dvh;height:100vh;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);}

/* 左侧导航 */
.sidebar{
  width:var(--nav-w);
  flex-shrink:0;
  background:linear-gradient(180deg,#dde5dd 0%,#d8e1d8 100%);
  border-right:1px solid var(--c-border-soft);
  display:flex;
  flex-direction:column;
  transition:width .3s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
  position:relative;
  z-index:20;
}
.sidebar.expanded{width:var(--nav-w-active);}
.brand{
  padding:18px 14px 14px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.5);
  min-height:68px;
  flex-shrink:0;
}
.brand-logo{
  width:52px;height:52px;border-radius:12px;
  background:linear-gradient(135deg,#8ba89b,#7b9489);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:11px;font-weight:700;
  flex-shrink:0;
  box-shadow:0 3px 8px rgba(95,122,110,.3);
}
.brand-text{white-space:nowrap;overflow:hidden;}
.brand-title{font-size:17px;font-weight:600;color:#3d4540;letter-spacing:.5px;}
.brand-sub{font-size:11px;color:var(--c-text-muted);margin-top:2px;}

.nav-list{flex:1;overflow-y:auto;padding:10px 8px;-webkit-overflow-scrolling:touch;}
.nav-list::-webkit-scrollbar{width:0;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 12px;border-radius:var(--radius-sm);
  color:var(--c-text-light);
  margin-bottom:4px;
  transition:all .2s;
  white-space:nowrap;overflow:hidden;
  position:relative;
}
.nav-item .nav-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:18px;
  background:rgba(255,255,255,.6);
  transition:all .2s;
}
.nav-item .nav-label{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;}
.nav-item.active{background:rgba(255,255,255,.85);color:#3d4540;font-weight:500;box-shadow:0 2px 8px rgba(95,122,110,.08);}
.nav-item.active .nav-icon{background:linear-gradient(135deg,#bcc9c3,#bccdb8);color:#3d4540;}
.nav-item:active{background:rgba(255,255,255,.6);}
.nav-item.active::before{
  content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:3px;background:linear-gradient(180deg,#8ba89b,#7a9a76);
}

.sidebar-footer{
  padding:10px 8px;border-top:1px solid rgba(255,255,255,.5);
  flex-shrink:0;display:flex;flex-direction:column;
}
.nav-export{padding:10px 12px;gap:12px;margin-bottom:4px;color:var(--c-text-light);font-size:13px;white-space:nowrap;overflow:hidden;}
.nav-export .nav-icon{background:rgba(255,255,255,.5);}
.nav-export:active{background:rgba(255,255,255,.5);}
.nav-export::before{display:none !important;}
.nav-toggle{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:10px;border-radius:var(--radius-sm);
  color:var(--c-text-muted);font-size:13px;
}
.nav-toggle:active{background:rgba(255,255,255,.5);}
.nav-toggle-icon{transition:transform .3s;font-size:16px;}
.sidebar.expanded .nav-toggle-icon{transform:rotate(180deg);}

/* 右侧内容 */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0;}
.header{
  padding:14px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--c-border-soft);
  flex-shrink:0;
  z-index:5;
}
.header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.header-menu-btn{
  display:none;width:36px;height:36px;border-radius:10px;
  align-items:center;justify-content:center;
  background:rgba(255,255,255,.6);color:var(--c-text);
  font-size:20px;flex-shrink:0;
}
.header h1{font-size:18px;font-weight:600;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-date{font-size:12px;color:var(--c-text-muted);margin-top:2px;}
.header-right{display:flex;gap:8px;flex-shrink:0;}
.header-tag{
  padding:4px 10px;border-radius:20px;font-size:11px;
  background:var(--c-green-100);color:#4a5e4d;
}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--c-blue-200);border-radius:4px;}

/* ===== 卡片 ===== */
.card{
  background:var(--c-card);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--c-shadow);
  border:1px solid rgba(229,231,235,.5);
}
.card-title{
  font-size:15px;font-weight:600;color:#1f2937;
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
}
.card-title .dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#8ba89b,#7a9a76);}

/* ===== 进度条 ===== */
.progress-wrap{margin-bottom:14px;}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;}
.progress-info .label{color:var(--c-text-light);}
.progress-info .value{font-weight:600;color:#1f2937;}
.progress-info .value .num{color:#5f7a6e;font-size:16px;}
.progress-bar{height:8px;background:var(--c-blue-50);border-radius:8px;overflow:hidden;}
.progress-fill{
  height:100%;border-radius:8px;
  background:linear-gradient(90deg,#8ba89b,#7a9a76);
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ===== 日期切换 ===== */
.date-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.date-nav-btn{
  width:36px;height:36px;border-radius:10px;
  background:var(--c-card);border:1px solid var(--c-border-soft);
  display:flex;align-items:center;justify-content:center;
  color:var(--c-text-light);font-size:18px;
  box-shadow:var(--c-shadow);
}
.date-nav-btn:active{background:var(--c-blue-50);}
.date-nav-btn:disabled{opacity:.4;}
.date-display{
  flex:1;text-align:center;padding:8px;border-radius:10px;
  background:var(--c-card);border:1px solid var(--c-border-soft);
  box-shadow:var(--c-shadow);
}
.date-display .date-text{font-size:14px;font-weight:600;color:#1f2937;}
.date-display .date-sub{font-size:11px;color:var(--c-text-muted);}
.date-today-btn{
  padding:6px 12px;border-radius:8px;font-size:12px;
  background:var(--c-blue-100);color:var(--c-blue-600);
  white-space:nowrap;
}

/* ===== 任务清单 ===== */
.task-list{margin-bottom:12px;}
.task-item{
  display:flex;align-items:center;gap:10px;
  padding:12px;border-radius:var(--radius-sm);
  background:var(--c-blue-50);margin-bottom:8px;
  transition:all .2s;
  border:1px solid transparent;
}
.task-item:active{background:var(--c-blue-100);}
.task-item.done{background:var(--c-green-50);opacity:.8;}
.task-item.done .task-text{text-decoration:line-through;color:var(--c-text-muted);}
.task-checkbox{
  width:24px;height:24px;border-radius:7px;
  border:2px solid var(--c-blue-300);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:#fff;transition:all .2s;
}
.task-item.done .task-checkbox{
  background:linear-gradient(135deg,#607d5d,#7a9a76);
  border-color:#607d5d;color:#fff;
}
.task-checkbox svg{width:14px;height:14px;opacity:0;transition:opacity .2s;}
.task-item.done .task-checkbox svg{opacity:1;}
.task-text{flex:1;font-size:14px;line-height:1.5;word-break:break-word;}
.task-del{
  width:28px;height:28px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  color:var(--c-text-muted);font-size:16px;flex-shrink:0;
  opacity:.5;
}
.task-del:active{background:rgba(180,120,120,.1);color:#b57373;opacity:1;}

.task-add{display:flex;gap:8px;margin-top:8px;}
.task-add input{
  flex:1;padding:10px 12px;border-radius:var(--radius-sm);
  background:var(--c-blue-50);border:1px solid var(--c-border-soft);
  font-size:14px;
}
.task-add input:focus{border-color:var(--c-blue-300);background:#fff;}
.task-add button{
  padding:0 16px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,#8ba89b,#5f7a6e);
  color:#fff;font-size:14px;font-weight:500;
  white-space:nowrap;
}
.task-add button:active{transform:scale(.96);}

/* ===== 统计卡 ===== */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-mini{
  background:var(--c-card);border-radius:var(--radius-sm);padding:12px 8px;
  text-align:center;box-shadow:var(--c-shadow);
  border:1px solid rgba(229,231,235,.4);
}
.stat-mini .num{font-size:22px;font-weight:700;color:#5f7a6e;line-height:1.2;}
.stat-mini .num.green{color:#607d5d;}
.stat-mini .label{font-size:11px;color:var(--c-text-muted);margin-top:4px;}

/* ===== 输入区 ===== */
.input-group{margin-bottom:12px;}
.input-group label{display:block;font-size:13px;color:var(--c-text-light);margin-bottom:6px;font-weight:500;}
.input-group input,.input-group textarea,.input-group select{
  width:100%;padding:10px 12px;border-radius:var(--radius-sm);
  background:var(--c-blue-50);border:1px solid var(--c-border-soft);
  font-size:14px;
}
.input-group input:focus,.input-group textarea:focus,.input-group select:focus{
  border-color:var(--c-blue-300);background:#fff;
}
.input-group textarea{resize:vertical;min-height:80px;line-height:1.6;}

.btn{
  padding:10px 16px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:500;transition:all .2s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{
  background:linear-gradient(135deg,#8ba89b,#5f7a6e);color:#fff;
  box-shadow:0 3px 8px rgba(95,122,110,.2);
}
.btn-primary:active{transform:scale(.97);}
.btn-mint{
  background:linear-gradient(135deg,#99b296,#607d5d);color:#fff;
  box-shadow:0 3px 8px rgba(96,125,93,.2);
}
.btn-mint:active{transform:scale(.97);}
.btn-ghost{
  background:var(--c-blue-50);color:var(--c-blue-600);
  border:1px solid var(--c-blue-100);
}
.btn-ghost:active{background:var(--c-blue-100);}
.btn-block{width:100%;}
.btn-row{display:flex;gap:8px;margin-top:8px;}
.btn-row .btn{flex:1;}

/* ===== 素材库 ===== */
.material-item{
  background:var(--c-card);border-radius:var(--radius);padding:14px;
  margin-bottom:10px;box-shadow:var(--c-shadow);
  border-left:3px solid var(--c-green-300);
}
.material-item .m-quote{
  font-size:14px;line-height:1.7;color:#1f2937;
  font-style:italic;margin-bottom:8px;
  padding-left:10px;border-left:2px solid var(--c-green-200);
  white-space:pre-wrap;word-break:break-word;
}
.material-item .m-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;font-size:12px;}
.material-item .m-tag{
  padding:2px 8px;border-radius:10px;font-size:11px;
  background:var(--c-blue-100);color:var(--c-blue-600);
}
.material-item .m-tag.green{background:var(--c-green-100);color:#4a5e4d;}
.material-item .m-source{font-size:12px;color:var(--c-text-muted);}
.material-item .m-inspire{
  font-size:13px;color:var(--c-text-light);margin-top:6px;
  padding:8px 10px;background:var(--c-green-50);border-radius:8px;
  line-height:1.6;
}
.material-item .m-del{
  float:right;width:28px;height:28px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  color:var(--c-text-muted);font-size:16px;
}
.material-item .m-del:active{color:#b57373;}

.hot-card{
  background:linear-gradient(135deg,#fff,var(--c-blue-50));
  border-radius:var(--radius);padding:14px;margin-bottom:10px;
  box-shadow:var(--c-shadow);border:1px solid rgba(191,219,254,.4);
}
.hot-card .h-title{font-size:14px;font-weight:600;color:#1f2937;margin-bottom:6px;line-height:1.5;}
.hot-card .h-author{font-size:12px;color:var(--c-blue-600);margin-bottom:6px;}
.hot-card .h-excerpt{font-size:13px;color:var(--c-text-light);line-height:1.7;margin-bottom:8px;padding:8px 10px;background:var(--c-blue-50);border-radius:8px;}
.hot-card .h-inspire{font-size:12px;color:#4a5e4d;padding:6px 10px;background:var(--c-green-50);border-radius:8px;line-height:1.6;}

/* ===== 仿写 ===== */
.imitate-item{
  background:var(--c-card);border-radius:var(--radius);padding:14px;
  margin-bottom:12px;box-shadow:var(--c-shadow);
}
.imitate-item .im-section{margin-bottom:12px;}
.imitate-item .im-label{
  font-size:12px;font-weight:600;margin-bottom:6px;
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:10px;
}
.imitate-item .im-label.original{background:var(--c-blue-100);color:var(--c-blue-600);}
.imitate-item .im-label.mine{background:var(--c-green-100);color:#4a5e4d;}
.imitate-item .im-text{
  font-size:14px;line-height:1.8;padding:10px 12px;border-radius:8px;
  white-space:pre-wrap;word-break:break-word;
}
.imitate-item .im-text.original{background:var(--c-blue-50);color:#1f2937;font-style:italic;}
.imitate-item .im-text.mine{background:var(--c-green-50);color:#1f2937;}
.imitate-item .im-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.imitate-item .im-tag{
  padding:4px 10px;border-radius:12px;font-size:12px;
  display:inline-flex;align-items:center;gap:4px;
}
.imitate-item .im-tag.todo{background:#f5efe0;color:#8b7355;}
.imitate-item .im-tag.done{background:var(--c-green-100);color:#4a5e4d;}
.imitate-item .im-actions{display:flex;gap:6px;margin-top:10px;}
.imitate-item .im-actions button{
  padding:5px 10px;border-radius:8px;font-size:12px;
  background:var(--c-blue-50);color:var(--c-blue-600);
}
.imitate-item .im-actions button:active{background:var(--c-blue-100);}
.imitate-item .im-actions .del{color:var(--c-text-muted);margin-left:auto;}

/* ===== 复盘 ===== */
.review-item{
  background:var(--c-card);border-radius:var(--radius);padding:14px;
  margin-bottom:12px;box-shadow:var(--c-shadow);
  border-top:3px solid var(--c-blue-300);
}
.review-item .r-date{font-size:12px;color:var(--c-text-muted);margin-bottom:8px;}
.review-item .r-link{
  font-size:13px;color:var(--c-blue-600);margin-bottom:8px;
  word-break:break-all;
}
.review-item .r-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.review-item .r-stat{text-align:center;padding:8px 4px;background:var(--c-blue-50);border-radius:8px;}
.review-item .r-stat .num{font-size:16px;font-weight:700;color:#5f7a6e;}
.review-item .r-stat .label{font-size:10px;color:var(--c-text-muted);margin-top:2px;}
.review-item .r-diagnosis{padding:10px 12px;background:var(--c-green-50);border-radius:8px;border-left:3px solid var(--c-green-300);}
.review-item .r-diagnosis .d-title{font-size:12px;font-weight:600;color:#4a5e4d;margin-bottom:4px;}
.review-item .r-diagnosis .d-text{font-size:13px;color:var(--c-text);line-height:1.7;}

.input-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.input-row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}

/* ===== 阅读清单 ===== */
.book-item{
  background:var(--c-card);border-radius:var(--radius);padding:14px;
  margin-bottom:10px;box-shadow:var(--c-shadow);
  display:flex;gap:12px;
}
.book-cover{
  width:50px;height:70px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,#bcc9c3,#bccdb8);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;
}
.book-info{flex:1;min-width:0;}
.book-name{font-size:14px;font-weight:600;color:#3d4540;margin-bottom:4px;word-break:break-word;}
.book-meta{font-size:12px;color:var(--c-text-muted);margin-bottom:6px;}
.book-progress{margin-bottom:6px;}
.book-feeling{
  font-size:13px;color:var(--c-text-light);line-height:1.6;
  padding:8px 10px;background:var(--c-green-50);border-radius:8px;
  margin-bottom:6px;font-style:italic;
}
.book-actions{display:flex;gap:6px;}
.book-actions button{
  padding:4px 10px;border-radius:8px;font-size:12px;
  background:var(--c-blue-50);color:var(--c-blue-600);
}
.book-actions .del{color:var(--c-text-muted);margin-left:auto;}

.reading-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}

/* ===== 空状态 ===== */
.empty{
  text-align:center;padding:40px 20px;color:var(--c-text-muted);
}
.empty .icon{font-size:40px;margin-bottom:10px;opacity:.5;}
.empty .text{font-size:13px;}

/* ===== 选题研究模块 ===== */
.search-bar{display:flex;gap:8px;margin-bottom:12px;}
.search-bar input{flex:1;padding:10px 14px;border-radius:24px;background:var(--c-card);border:1px solid var(--c-border-soft);font-size:14px;box-shadow:var(--c-shadow);}
.search-bar input:focus{border-color:var(--c-blue-300);background:#fff;}
.search-bar button{padding:0 18px;border-radius:24px;background:linear-gradient(135deg,#8ba89b,#5f7a6e);color:#fff;font-size:14px;font-weight:500;white-space:nowrap;flex-shrink:0;}
.search-bar button:active{transform:scale(.96);}
.search-hints{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.search-hint{padding:5px 12px;border-radius:16px;font-size:12px;background:var(--c-blue-50);color:var(--c-blue-600);border:1px solid var(--c-blue-100);white-space:nowrap;}
.search-hint:active{background:var(--c-blue-100);}

/* 话题卡片 */
.topic-card{
  background:var(--c-card);border-radius:var(--radius);padding:14px;
  margin-bottom:10px;box-shadow:var(--c-shadow);
  border-left:3px solid var(--c-teal);cursor:pointer;
  transition:all .2s;
}
.topic-card:active{box-shadow:var(--c-shadow-hover);transform:translateY(-1px);}
.topic-card .tc-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.topic-card .tc-title{font-size:14px;font-weight:600;color:#3d4540;line-height:1.5;flex:1;}
.topic-card .tc-stats{display:flex;gap:10px;font-size:11px;color:var(--c-text-muted);flex-shrink:0;text-align:right;}
.topic-card .tc-stats span{display:block;line-height:1.4;}
.topic-card .tc-stats .hot{color:#b57373;font-weight:600;}
.topic-card .tc-preview{font-size:12px;color:var(--c-text-light);line-height:1.6;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.topic-card .tc-tags{display:flex;flex-wrap:wrap;gap:4px;}
.topic-card .tc-tag{padding:2px 8px;border-radius:10px;font-size:10px;background:var(--c-green-50);color:#4a5e4d;}
.topic-card .tc-expand{text-align:center;font-size:12px;color:var(--c-text-muted);padding-top:4px;}

/* 深度报告弹层 */
.report-panel{
  background:var(--c-card);border-radius:var(--radius);padding:0;
  margin-bottom:12px;box-shadow:var(--c-shadow-hover);
  border:1px solid var(--c-border-soft);overflow:hidden;
  max-height:0;opacity:0;transition:max-height .5s ease,opacity .3s,padding .3s;
}
.report-panel.open{max-height:3000px;opacity:1;padding:18px;}
.report-panel .rp-title{font-size:15px;font-weight:600;color:#3d4540;margin-bottom:4px;}
.report-panel .rp-subtitle{font-size:12px;color:var(--c-text-muted);margin-bottom:16px;}
.report-section{margin-bottom:16px;}
.report-section h4{
  font-size:13px;font-weight:600;color:var(--c-blue-600);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.report-section h4::before{content:'';display:inline-block;width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,#8ba89b,#7a9a76);}
.report-section .rs-content{
  font-size:13px;line-height:1.8;color:var(--c-text);
  padding:10px 12px;background:var(--c-blue-50);border-radius:var(--radius-sm);
}
.report-section .rs-content ul{margin:4px 0;padding-left:18px;}
.report-section .rs-content li{margin-bottom:4px;list-style-type:disc;}
.report-section .rs-content .highlight{color:var(--c-blue-600);font-weight:500;}

/* 文案结构卡片 */
.structure-block{
  background:var(--c-green-50);border-radius:var(--radius-sm);padding:12px;
  margin-bottom:8px;border-left:3px solid var(--c-green-300);
}
.structure-block .s-label{font-size:11px;font-weight:600;color:#4a5e4d;margin-bottom:4px;}
.structure-block .s-text{font-size:12px;color:var(--c-text);line-height:1.7;}

/* 加载动画 */
.search-loading{text-align:center;padding:30px;color:var(--c-text-muted);font-size:13px;}
.search-loading .spinner{
  display:inline-block;width:24px;height:24px;border:3px solid var(--c-border-soft);
  border-top-color:var(--c-blue-500);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* 报告关闭按钮 */
.rp-close{
  float:right;width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--c-text-muted);font-size:16px;background:var(--c-blue-50);
}
.rp-close:active{background:var(--c-blue-100);color:#b57373;}

/* ===== Toast ===== */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:rgba(31,41,55,.92);color:#fff;padding:10px 20px;border-radius:24px;
  font-size:13px;z-index:9999;transition:transform .3s;
  backdrop-filter:blur(10px);max-width:90%;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ===== 导出提醒弹窗 ===== */
.reminder-modal{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;
}
.reminder-modal.show{opacity:1;pointer-events:auto;}
.reminder-body{
  background:var(--c-card);border-radius:var(--radius);padding:24px 20px;
  width:90%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.15);
  text-align:center;
}
.reminder-body h3{font-size:17px;color:#3d4540;margin-bottom:8px;}
.reminder-body p{font-size:13px;color:var(--c-text-light);line-height:1.7;margin-bottom:16px;}
.reminder-body .reminder-actions{display:flex;gap:8px;}
.reminder-body .reminder-actions button{flex:1;}
.reminder-body .reminder-actions .skip{background:var(--c-blue-50);color:var(--c-text-muted);padding:10px;border-radius:var(--radius-sm);font-size:13px;}
.reminder-body .reminder-actions .do{background:linear-gradient(135deg,#8ba89b,#5f7a6e);color:#fff;padding:10px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;}
.reminder-body .reminder-actions .do:active{transform:scale(.97);}
.reminder-body .reminder-actions .later{background:var(--c-blue-100);color:var(--c-blue-600);padding:10px;border-radius:var(--radius-sm);font-size:13px;}

/* ===== 遮罩 ===== */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.show{opacity:1;pointer-events:auto;}

/* ===== 移动端适配 ===== */
@media (max-width:768px){
  :root{--nav-w:64px;--nav-w-active:240px;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100dvh;height:100vh;z-index:30;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
  .sidebar.show{transform:translateX(0);}
  .sidebar.expanded{width:var(--nav-w-active);}
  .header-menu-btn{display:flex;}
  .content{padding:12px 12px 20px;}
  .card{padding:14px;}
  .stats-grid{grid-template-columns:repeat(3,1fr);}
  .input-row-4{grid-template-columns:repeat(2,1fr);}
  .review-item .r-stats{grid-template-columns:repeat(4,1fr);}
}

@media (min-width:769px){
  .sidebar{position:relative;}
  .nav-toggle{display:none;}
}

/* 横屏优化 */
@media (max-width:900px) and (orientation:landscape){
  .content{padding:12px 16px 16px;}
}

/* 字体大小适配 */
@media (max-width:360px){
  body{font-size:14px;}
  .stat-mini .num{font-size:18px;}
  .review-item .r-stats{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div class="app">
  <!-- 左侧导航 -->

    <div class="brand">

  <div class="reminder-body">
    <h3>📝 每周导出提醒</h3>
    <p id="reminderMsg">又是新的一周了！上次导出是 7 天前，建议现在导出一份 Markdown 备份，确保所有读写记录安全保存到本地。</p>
    <div class="reminder-actions">
      <button class="skip" id="reminderSkip">跳过</button>
      <button class="do" id="reminderExport">立即导出</button>
      <button class="later" id="reminderLater">1天后提醒</button>
    </div>

<script>
/* ============================================================
   半两闲 · 读写工作台
   核心定位：通过阅读和写作探索自我的内容创作者
   数据持久化：localStorage
   ============================================================ */

/* ===== 存储 ===== */
const Store = {
  prefix:'banliangxian_',
  get(key,def=null){
    try{
      const v = localStorage.getItem(this.prefix+key);
      return v?JSON.parse(v):def;
    }catch(e){return def;}
  },
  set(key,val){
    try{localStorage.setItem(this.prefix+key,JSON.stringify(val));}catch(e){console.error('存储失败',e);}
  },
  remove(key){localStorage.removeItem(this.prefix+key);},
  getRaw(key,def=''){
    try{
      const v = localStorage.getItem(this.prefix+key);
      return v||def;
    }catch(e){return def;}
  },
  setRaw(key,val){
    try{localStorage.setItem(this.prefix+key,val);}catch(e){console.error('存储失败',e);}
  }
};

/* ===== 工具 ===== */
const todayStr = ()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const formatDateCN = (s)=>{const [y,m,d]=s.split('-');return `${y}年${m}月${d}日`;};
const weekdayCN = (s)=>{const d=new Date(s+'T00:00:00');return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];};
const shiftDate = (s,days)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ===== Markdown 导出引擎 ===== */
const MDExporter = {
  buildFullMD(){
    const now = new Date();
    const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    let md = `# 半两闲 · 读写工作台 — 数据导出\n\n`;
    md += `> 导出时间：${ts}\n\n---\n\n`;

    // 1. 每日读写计划
    md += `## 📋 每日读写计划\n\n`;
    const planAll = Store.get('plan_tasks',{});
    const planDates = Object.keys(planAll).sort().reverse();
    for(const date of planDates.slice(0,30)){
      const tasks = planAll[date];
      const done = tasks.filter(t=>t.done).length;
      md += `### ${formatDateCN(date)} ${weekdayCN(date)} (${done}/${tasks.length})\n\n`;
      for(const t of tasks){
        md += `- [${t.done?'x':' '}] ${t.text}\n`;
      }
      md += `\n`;
    }
    md += `---\n\n`;

    // 2. 文笔素材库
    md += `## ✨ 文笔素材库\n\n`;
    const materials = Store.get('materials',[]);
    for(const m of materials){
      md += `### 📅 ${formatDateCN(m.date)}\n\n`;
      md += `> ${m.quote.replace(/\n/g,'\n> ')}\n\n`;
      if(m.source) md += `**出处**：${m.source}\n\n`;
      if(m.inspire) md += `**写作启发**：${m.inspire}\n\n`;
      md += `---\n\n`;
    }

    // 3. 文笔仿写
    md += `## ✍️ 文笔仿写练习\n\n`;
    const imitates = Store.get('imitates',[]);
    for(const it of imitates){
      const status = it.tags.includes('done')?'已掌握':'待练习';
      md += `### ${formatDateCN(it.date)} — ${status}\n\n`;
      md += `**原文**：\n> ${it.original.replace(/\n/g,'\n> ')}\n\n`;
      md += `**我的仿写**：\n> ${it.mine.replace(/\n/g,'\n> ')}\n\n`;
      md += `---\n\n`;
    }

    // 4. 内容复盘
    md += `## 📊 内容复盘\n\n`;
    const reviews = Store.get('reviews',[]);
    for(const r of reviews){
      md += `### 📅 ${formatDateCN(r.date)} ${weekdayCN(r.date)}\n\n`;
      if(r.link) md += `- 🔗 链接：${r.link}\n`;
      md += `- 点赞：${r.likes} | 收藏：${r.saves} | 评论：${r.comments} | 涨粉：${r.fans}\n\n`;
      for(const d of r.diagnosis){
        md += `**💡 ${d.title}**：${d.text}\n\n`;
      }
      md += `---\n\n`;
    }

    // 5. 阅读清单
    md += `## 📚 阅读清单\n\n`;
    const books = Store.get('books',[]);
    const records = Store.get('reading_records',{});
    for(const b of books){
      const pct = b.totalPages?Math.round(b.currentPage/b.totalPages*100):0;
      const done = b.totalPages>0&&b.currentPage>=b.totalPages;
      md += `### ${b.name} ${done?'✅ 已读完':''}\n\n`;
      md += `- 类别：${b.category}\n`;
      md += `- 进度：${b.currentPage}/${b.totalPages||'?'}页 (${pct}%)\n`;
      md += `- 添加日期：${formatDateCN(b.date)}\n\n`;
    }
    // 阅读记录按日期排列
    const recDates = Object.keys(records).sort().reverse();
    if(recDates.length){
      md += `### 📖 每日阅读记录\n\n`;
      for(const date of recDates.slice(0,30)){
        const dayRecs = records[date];
        const dayPages = dayRecs.reduce((s,x)=>s+x.pages,0);
        md += `#### ${formatDateCN(date)} ${weekdayCN(date)} — 共 ${dayPages} 页\n\n`;
        for(const r of dayRecs){
          md += `- 《${r.bookName}》 +${r.pages}页`;
          if(r.feeling) md += ` — "${r.feeling}"`;
          md += `\n`;
        }
        md += `\n`;
      }
    }
    md += `\n---\n> 由「半两闲 · 读写工作台」自动生成\n`;

    return md;
  },

  download(filename='banliangxian_backup.md'){
    const md = this.buildFullMD();
    const blob = new Blob([md],{type:'text/markdown;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    // 记录本次导出时间
    Store.setRaw('last_export',Date.now().toString());
    return md;
  }
};

/* ===== 每周导出提醒系统 ===== */
const ExportReminder = {
  // 检查是否需要提醒（距离上次导出超过7天）
  shouldRemind(){
    const reminderOff = Store.getRaw('reminder_off','')==='1';
    if(reminderOff) return false;

    const lastExport = parseInt(Store.getRaw('last_export','0'));
    if(!lastExport) return false; // 从未导出，不提醒（首次打开别弹）

    const snoozeUntil = parseInt(Store.getRaw('reminder_snooze','0'));
    if(snoozeUntil && Date.now() < snoozeUntil) return false;

    const daysSinceExport = (Date.now() - lastExport) / (1000*60*60*24);
    return daysSinceExport >= 7;
  },

  show(){
    document.getElementById('reminderModal').classList.add('show');
  },

  hide(){
    document.getElementById('reminderModal').classList.remove('show');
  },

  exportAndHide(){
    this.hide();
    setTimeout(()=>{
      MDExporter.download();
      toast('✅ 已导出 Markdown 备份文件');
    },300);
  },

  snooze(){
    // 1天后提醒
    Store.setRaw('reminder_snooze',(Date.now()+86400000).toString());
    this.hide();
    toast('已推迟，1天后提醒');
  },

  skip(){
    this.hide();
  },

  toggle(){
    const off = Store.getRaw('reminder_off','')==='1';
    if(off){
      Store.setRaw('reminder_off','0');
      document.getElementById('reminderIcon').textContent = '🔔';
      document.getElementById('reminderLabel').textContent = '每周导出提醒：开';
      toast('✅ 每周导出提醒已开启');
    } else {
      Store.setRaw('reminder_off','1');
      document.getElementById('reminderIcon').textContent = '🔕';
      document.getElementById('reminderLabel').textContent = '每周导出提醒：关';
      toast('已关闭每周导出提醒');
    }
  },

  updateUI(){
    const off = Store.getRaw('reminder_off','')==='1';
    document.getElementById('reminderIcon').textContent = off?'🔕':'🔔';
    document.getElementById('reminderLabel').textContent = off?'每周导出提醒：关':'每周导出提醒：开';
  },

  init(){
    // 绑定弹窗按钮
    document.getElementById('reminderExport').onclick = ()=>this.exportAndHide();
    document.getElementById('reminderSkip').onclick = ()=>this.skip();
    document.getElementById('reminderLater').onclick = ()=>this.snooze();
    document.getElementById('reminderModal').onclick = (e)=>{
      if(e.target===document.getElementById('reminderModal')) this.hide();
    };
    // 绑定侧栏开关
    document.getElementById('exportReminderBtn').onclick = ()=>this.toggle();
    this.updateUI();
    // 每天检查一次提醒（启动时检查）
    setTimeout(()=>{
      if(this.shouldRemind()) this.show();
    },2000);
  }
};

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),2200);
}

function escapeHTML(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ===== 默认任务 ===== */
const DEFAULT_TASKS = [
  '深度阅读30分钟',
  '摘抄/记录打动我的句子',
  '写300字随笔/读后感',
  '拆解一篇喜欢的文章结构',
  '晚上11:30之前睡觉'
];

/* ===== 模块 ===== */
const App = {
  currentModule:'plan',
  currentDate:todayStr(),
};

/* ---------- 模块1：每日读写计划 ---------- */
const PlanModule = {
  currentDate:todayStr(),

  getTasks(date){
    const all = Store.get('plan_tasks',{});
    if(!all[date]){
      all[date] = DEFAULT_TASKS.map(text=>({id:uid(),text,done:false}));
      Store.set('plan_tasks',all);
    }
    return all[date];
  },
  saveTasks(date,tasks){
    const all = Store.get('plan_tasks',{});
    all[date]=tasks;
    Store.set('plan_tasks',all);
  },
  toggleTask(id){
    const tasks = this.getTasks(this.currentDate);
    const t = tasks.find(x=>x.id===id);
    if(t){t.done=!t.done;this.saveTasks(this.currentDate,tasks);}
    this.render();
  },
  addTask(text){
    if(!text.trim())return;
    const tasks=this.getTasks(this.currentDate);
    tasks.push({id:uid(),text:text.trim(),done:false});
    this.saveTasks(this.currentDate,tasks);
    this.render();
  },
  delTask(id){
    const tasks=this.getTasks(this.currentDate);
    this.saveTasks(this.currentDate,tasks.filter(x=>x.id!==id));
    this.render();
  },
  render(){
    const wrap=document.getElementById('content');
    const tasks=this.getTasks(this.currentDate);
    const total=tasks.length;
    const done=tasks.filter(x=>x.done).length;
    const pct=total?Math.round(done/total*100):0;
    const isToday=this.currentDate===todayStr();

    wrap.innerHTML=`
      <div class="date-nav">
        <button class="date-nav-btn" id="prevDay">‹</button>
        <div class="date-display">
          <div class="date-text">${formatDateCN(this.currentDate)}</div>
          <div class="date-sub">${weekdayCN(this.currentDate)}${isToday?' · 今天':''}</div>
        </div>
        <button class="date-nav-btn" id="nextDay" ${isToday?'disabled':''}>›</button>
      </div>
      ${!isToday?`<button class="date-today-btn btn btn-ghost btn-block" id="backToday" style="margin-bottom:12px;">回到今天</button>`:''}

      <div class="card">
        <div class="card-title"><span class="dot"></span>今日完成进度</div>
        <div class="progress-wrap">
          <div class="progress-info">
            <span class="label">读写打卡</span>
            <span class="value"><span class="num">${done}</span> / ${total}</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="stats-grid">
          <div class="stat-mini"><div class="num">${total}</div><div class="label">总任务</div></div>
          <div class="stat-mini"><div class="num green">${done}</div><div class="label">已完成</div></div>
          <div class="stat-mini"><div class="num">${pct}%</div><div class="label">完成率</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="dot"></span>今日任务清单</div>
        <div class="task-list" id="taskList">
          ${tasks.length?tasks.map(t=>`
            <div class="task-item ${t.done?'done':''}" data-id="${t.id}">
              <div class="task-checkbox" data-action="toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
              <div class="task-text">${escapeHTML(t.text)}</div>
              <button class="task-del" data-action="del">✕</button>
            </div>
          `).join(''):'<div class="empty"><div class="icon">📝</div><div class="text">暂无任务，添加一个开始今天的读写吧</div></div>'}
        </div>
        <div class="task-add">
          <input type="text" id="taskInput" placeholder="添加新的读写任务…" maxlength="80">
          <button id="addTaskBtn">添加</button>
        </div>
      </div>
    `;

    document.getElementById('prevDay').onclick=()=>{this.currentDate=shiftDate(this.currentDate,-1);this.render();};
    document.getElementById('nextDay').onclick=()=>{if(!isToday){this.currentDate=shiftDate(this.currentDate,1);this.render();}};
    const backToday=document.getElementById('backToday');
    if(backToday)backToday.onclick=()=>{this.currentDate=todayStr();this.render();};

    document.getElementById('addTaskBtn').onclick=()=>{
      const inp=document.getElementById('taskInput');
      this.addTask(inp.value);inp.value='';inp.focus();
    };
    document.getElementById('taskInput').onkeydown=e=>{if(e.key==='Enter'){this.addTask(e.target.value);e.target.value='';}};

    document.querySelectorAll('.task-item').forEach(el=>{
      const id=el.dataset.id;
      el.querySelector('[data-action="toggle"]').onclick=()=>this.toggleTask(id);
      el.querySelector('[data-action="del"]').onclick=()=>this.delTask(id);
    });
  }
};

const ReviewModule = {
  items:[],
  init(){this.items=Store.get('reviews',[]);},
  add(link,likes,saves,comments,fans){
    const data={likes:+likes||0,saves:+saves||0,comments:+comments||0,fans:+fans||0};
    const diag=this.diagnose(data);
    this.items.unshift({
      id:uid(),
      link:link.trim(),
      ...data,
      diagnosis:diag,
      date:todayStr(),
      ts:Date.now()
    });
    Store.set('reviews',this.items);
    this.render();
  },
  del(id){this.items=this.items.filter(x=>x.id!==id);Store.set('reviews',this.items);this.render();},
  diagnose(d){
    const tips=[];
    // 收藏多点赞少
    if(d.saves>d.likes*1.5 && d.saves>10){
      tips.push({title:'收藏远多于点赞',text:'内容干货充足，但标题和封面缺乏吸引力。下次可尝试更情绪化、更有悬念的标题，让读者在信息流中忍不住点进来。'});
    }
    // 互动少
    if(d.likes>50 && d.comments<3){
      tips.push({title:'互动率偏低',text:'读者看完就走了，缺少互动契机。结尾可增加互动提问，例如"你最想推荐的一本书是什么？"或"这段文字让你想到了什么？"引导读者分享。'});
    }
    // 涨粉慢
    if(d.likes>100 && d.fans<5){
      tips.push({title:'涨粉转化慢',text:'内容可能不够垂直，读者看完没有关注理由。建议围绕一位作家或一个写作方法做系列内容，让人有"追更"的期待感。'});
    }
    // 数据整体好
    if(d.likes>200 && d.fans>=10){
      tips.push({title:'数据表现优秀',text:'这篇内容方向很好！建议总结这篇的写作结构，提炼成可复用的模板，持续产出同类内容放大优势。'});

/* ---------- 模块5：阅读清单 ---------- */
const ReadingModule = {
  books:[],
  records:[],
  init(){
    this.books=Store.get('books',[]);
    this.records=Store.get('reading_records',{});
  },
  addBook(name,category,totalPages){
    const book={
      id:uid(),
      name:name.trim(),
      category:(category||'').trim()||'未分类',
      totalPages:+totalPages||0,
      currentPage:0,
      date:todayStr(),
      ts:Date.now()
    };
    this.books.unshift(book);
    Store.set('books',this.books);
    this.render();
  },
  delBook(id){
    this.books=this.books.filter(x=>x.id!==id);
    Store.set('books',this.books);
    this.render();
  },
  updateProgress(id,pages,feeling){
    const book=this.books.find(x=>x.id===id);
    if(!book)return;
    book.currentPage=Math.min(book.currentPage+(+pages||0),book.totalPages);
    const today=todayStr();
    if(!this.records[today])this.records[today]=[];
    this.records[today].push({
      bookId:id,
      bookName:book.name,
      pages:+pages||0,
      feeling:(feeling||'').trim(),
      time:Date.now()
    });
    Store.set('books',this.books);
    Store.set('reading_records',this.records);
    this.render();
  },
  getTodayPages(){
    const today=todayStr();
    const recs=this.records[today]||[];
    return recs.reduce((s,x)=>s+x.pages,0);
  },
  getMonthPages(){
    const now=new Date();
    const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    let total=0;
    Object.entries(this.records).forEach(([date,recs])=>{
      if(date.startsWith(ym)){
        total+=recs.reduce((s,x)=>s+x.pages,0);
      }
    });
    return total;
  },
  getReadingDays(){
    return Object.keys(this.records).length;
  },
  render(){
    const wrap=document.getElementById('content');
    const todayPages=this.getTodayPages();
    const monthPages=this.getMonthPages();
    const readingDays=this.getReadingDays();
    const today=todayStr();
    const todayRecs=this.records[today]||[];

    wrap.innerHTML=`
      <div class="card">
        <div class="card-title"><span class="dot"></span>添加书目</div>
        <div class="input-row">
          <div class="input-group">
            <label>书名</label>
            <input type="text" id="bookName" placeholder="如：瓦尔登湖">
          </div>
          <div class="input-group">
            <label>类别</label>
            <input type="text" id="bookCategory" placeholder="散文/小说/…">
          </div>
        </div>
        <div class="input-group">
          <label>总页数</label>
          <input type="number" id="bookPages" placeholder="如：320" inputmode="numeric">
        </div>
        <button class="btn btn-primary btn-block" id="addBook">加入阅读清单</button>
      </div>

      <div class="card">
        <div class="card-title"><span class="dot"></span>阅读统计</div>
        <div class="reading-stats">
          <div class="stat-mini"><div class="num">${todayPages}</div><div class="label">今日阅读页</div></div>
          <div class="stat-mini"><div class="num green">${monthPages}</div><div class="label">本月阅读页</div></div>
        </div>
        <div class="stats-grid">
          <div class="stat-mini"><div class="num">${readingDays}</div><div class="label">阅读天数</div></div>
          <div class="stat-mini"><div class="num">${this.books.length}</div><div class="label">在读书目</div></div>
          <div class="stat-mini"><div class="num green">${this.books.filter(x=>x.totalPages>0&&x.currentPage>=x.totalPages).length}</div><div class="label">已读完</div></div>
        </div>
      </div>

      ${todayRecs.length?`
      <div class="card">
        <div class="card-title"><span class="dot"></span>今日阅读记录</div>
        ${todayRecs.map(r=>`
          <div class="material-item" style="border-left-color:var(--c-blue-300);">
            <div class="m-meta">
              <span class="m-tag">📖 ${escapeHTML(r.bookName)}</span>
              <span class="m-tag green">+${r.pages}页</span>
            </div>
            ${r.feeling?`<div class="m-inspire" style="background:var(--c-blue-50);font-style:italic;">"${escapeHTML(r.feeling)}"</div>`:''}
          </div>
        `).join('')}
      </div>`:''}

      <div class="card">
        <div class="card-title"><span class="dot"></span>我的书单（${this.books.length}本）</div>
        ${this.books.length?this.books.map(b=>{
          const pct=b.totalPages?Math.round(b.currentPage/b.totalPages*100):0;
          const finished=b.totalPages>0&&b.currentPage>=b.totalPages;
          return `
          <div class="book-item">
            <div class="book-cover">${finished?'✓':'📖'}</div>
            <div class="book-info">
              <div class="book-name">${escapeHTML(b.name)} ${finished?'<span style="color:#607d5d;font-size:12px;">已读完</span>':''}</div>
              <div class="book-meta">${escapeHTML(b.category)} · ${b.currentPage}/${b.totalPages||'?'}页</div>
              <div class="book-progress">
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                <div style="font-size:11px;color:var(--c-text-muted);margin-top:4px;">进度 ${pct}%</div>
              </div>
              <div class="book-actions">
                <button data-id="${b.id}" data-action="progress">记录进度</button>
                <button class="del" data-id="${b.id}" data-action="del">删除</button>
              </div>
            </div>
          </div>
          `;
        }).join(''):'<div class="empty"><div class="icon">📚</div><div class="text">书单还是空的，添加一本想读的书开始吧</div></div>'}
      </div>
    `;

    document.getElementById('addBook').onclick=()=>{
      const name=document.getElementById('bookName').value;
      const cat=document.getElementById('bookCategory').value;
      const pages=document.getElementById('bookPages').value;
      if(!name.trim()){toast('请输入书名');return;}
      this.addBook(name,cat,pages);
      toast('已加入阅读清单');
      document.getElementById('bookName').value='';
      document.getElementById('bookCategory').value='';
      document.getElementById('bookPages').value='';
    };

    document.querySelectorAll('.book-actions button').forEach(b=>{
      b.onclick=()=>{
        const id=b.dataset.id;
        if(b.dataset.action==='del'){this.delBook(id);return;}
        if(b.dataset.action==='progress'){
          const book=this.books.find(x=>x.id===id);
          if(!book)return;
          const pages=prompt(`《${book.name}》今日阅读页数：`,'10');
          if(pages===null)return;
          const feeling=prompt('今日一句总结性感想（可选）：','');
          this.updateProgress(id,pages,feeling);
          toast('已记录今日阅读进度');
        }
      };
    });
  }
};

  init(){
    // 历史搜索记录
    const saved = Store.getRaw('research_history','');
    this.history = saved?JSON.parse(saved):[];

    // 数据日期检查
    this.dataDate = Store.getRaw('research_data_date','');
    const todayStr = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;
    this.isDataFresh = (this.dataDate === todayStr);

    // 如果数据日期为空（首次使用），标记为今天
    if(!this.dataDate){
      Store.setRaw('research_data_date', todayStr);
      this.dataDate = todayStr;
      this.isDataFresh = true;
    }

    // 获取缓存的热帖数据（可能从 refreshData 写入）
    const cached = Store.getRaw('research_cached_topics','');
    if(cached){
      try{
        const parsed = JSON.parse(cached);
        if(parsed && parsed.length > 0){
          // 合并缓存数据到 topicLibrary 前面
          this.topicLibrary = [...parsed, ...this.topicLibrary];
        }
      }catch(e){}
    }
  },

    if(this.topics.length === 0){

    }
    this.render();
  },

      const toAdd = freshTopics.filter(t=>!existingIds.has(t.id));
      this.topicLibrary = [...toAdd, ...this.topicLibrary];

      // 自动搜索展示最新数据
      this.topics = [...this.topicLibrary].sort(()=>Math.random()-.5);
      this.render();
      toast('✅ 数据已更新至 '+todayStr+'，包含3条最新选题');
    },1000);
  },

  search(keyword){
    this.isSearching = true;
    this.render();
    // 模拟搜索延迟
    setTimeout(()=>{
      const kw = (keyword||'').toLowerCase().trim();
      let results;
      if(!kw || kw==='阅读' || kw==='写作' || kw==='文笔' || kw==='读书'){
        results = [...this.topicLibrary].sort(()=>Math.random()-.5);
      } else {
        results = this.topicLibrary.filter(t=>
          t.title.toLowerCase().includes(kw) ||
          t.tags.some(tag=>tag.toLowerCase().includes(kw)) ||
          t.preview.toLowerCase().includes(kw)
        );
        if(results.length===0) results = [...this.topicLibrary].sort(()=>Math.random()-.5).slice(0,3);
      }
      this.topics = results;
      this.isSearching = false;
      // 保存搜索记录
      if(kw){
        this.history.unshift({kw:keyword,time:Date.now()});
        this.history = this.history.slice(0,10);
        Store.setRaw('research_history',JSON.stringify(this.history));
      }
      this.render();
    },800);
  },

  toggleReport(id){
    if(this.activeReport===id){
      this.activeReport = null;
    } else {
      this.activeReport = id;
    }
    this.render();
  },

  render(){
    const wrap=document.getElementById('content');
    const activeTopic = this.topics.find(t=>t.id===this.activeReport);
    const hints = ['文笔提升','画面感写作','作家拆解','读书笔记模板','写作疗愈','金句摘抄','写作心法','每日练习'];

    let html = `
      <div class="card">
        <div class="card-title"><span class="dot"></span>搜索热门选题</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;">
          <span style="font-size:11px;color:var(--c-text-muted);">${this.getFreshnessText()}</span>
          <button class="btn btn-ghost" id="refreshDataBtn" style="padding:4px 10px;font-size:11px;border-radius:14px;">🔄 刷新今日数据</button>
        </div>
        <div class="search-bar">
          <input type="text" id="researchInput" placeholder="搜索阅读写作相关选题…" maxlength="40">
          <button id="researchSearch">搜索</button>
        </div>
        <div class="search-hints">
          ${hints.map(h=>`<span class="search-hint" data-kw="${h}">${h}</span>`).join('')}
        </div>
        ${this.history.length?`
        <div style="font-size:11px;color:var(--c-text-muted);margin-bottom:8px;">最近搜索：${this.history.slice(0,5).map(h=>`<span class="search-hint" data-kw="${h.kw}" style="cursor:pointer;">${h.kw}</span>`).join(' ')}</div>
        `:''}
      </div>`;

    if(this.isSearching){
      html += `<div class="search-loading"><div class="spinner"></div><div>正在分析「阅读写作」赛道热门选题…</div></div>`;
    } else if(this.topics.length){
      html += `<div class="card"><div class="card-title"><span class="dot"></span>共找到 ${this.topics.length} 个热门选题</div>`;
      for(const t of this.topics){
        const isOpen = this.activeReport===t.id;
        html += `
        <div class="topic-card" data-id="${t.id}">
          <div class="tc-header">
            <div class="tc-title">${escapeHTML(t.title)}</div>
            <div class="tc-stats">
              <span class="hot">🔥 ${t.hot}w</span>
              <span>👍 ${escapeHTML(t.likes)}</span>
            </div>
          </div>
          <div class="tc-preview">${escapeHTML(t.preview)}</div>
          <div class="tc-tags">${t.tags.map(tag=>`<span class="tc-tag">#${escapeHTML(tag)}</span>`).join('')}</div>
          <div class="tc-expand">${isOpen?'▲ 收起报告':'▼ 展开深度分析报告'}</div>
        </div>`;

        if(isOpen){
          html += `
          <div class="report-panel open">
            <button class="rp-close" data-close="${t.id}">✕</button>
            <div class="rp-title">📊 深度选题分析报告</div>
            <div class="rp-subtitle">${escapeHTML(t.title)} · 热度 ${t.hot}w</div>

            <div class="report-section">
              <h4>🔀 可延伸的方向</h4>
              <div class="rs-content"><ul>${t.extends.map(e=>`<li>${escapeHTML(e)}</li>`).join('')}</ul></div>
            </div>

            <div class="report-section">
              <h4>🌍 相关社会议题</h4>
              <div class="rs-content">
                ${t.socialIssues.map(si=>`
                  <div class="structure-block">
                    <div class="s-label">${escapeHTML(si.title)}</div>
                    <div class="s-text">${escapeHTML(si.desc)}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="report-section">
              <h4>📈 流量规律</h4>
              <div class="rs-content">${escapeHTML(t.trafficRule)}</div>
            </div>

            <div class="report-section">
              <h4>📝 ${escapeHTML(t.structureAnalysis.title)}</h4>
              <div class="rs-content">
                ${t.structureAnalysis.blocks.map(b=>`
                  <div class="structure-block">
                    <div class="s-label">${escapeHTML(b.label)}</div>
                    <div class="s-text">${escapeHTML(b.text)}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="report-section">
              <h4>🧠 行文逻辑总结</h4>
              <div class="rs-content">${escapeHTML(t.logicAnalysis)}</div>
            </div>
          </div>`;
        }
      }
      html += `</div>`;
    } else {
      html += `<div class="card"><div class="empty"><div class="icon">🔍</div><div class="text">点击搜索或热门标签，探索阅读写作赛道的热门选题</div></div></div>`;
    }

    wrap.innerHTML = html;

    // 事件绑定
    const inp = document.getElementById('researchInput');
    const searchBtn = document.getElementById('researchSearch');
    if(searchBtn){
      searchBtn.onclick = ()=>{
        const kw = (inp?inp.value:'').trim();
        if(!kw){toast('请输入关键词或直接搜索查看全部');this.search('');return;}
        this.search(kw);
      };
      if(inp) inp.onkeydown = e=>{if(e.key==='Enter'){this.search((inp.value||'').trim());}};
    }

    // 热门标签点击
    document.querySelectorAll('.search-hint[data-kw]').forEach(el=>{
      el.onclick = ()=>{
        const kw = el.dataset.kw;
        if(inp) inp.value = kw;
        this.search(kw);
      };
    });

    // 话题卡片点击
    document.querySelectorAll('.topic-card').forEach(el=>{
      el.onclick = ()=>{
        const id = el.dataset.id;
        this.toggleReport(id);
        // 滚动到报告位置
        if(this.activeReport===id){
          setTimeout(()=>{
            const panel = document.querySelector('.report-panel.open');
            if(panel) panel.scrollIntoView({behavior:'smooth',block:'start'});
          },100);
        };
      };
    });

    // 关闭报告
    document.querySelectorAll('.rp-close').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        this.activeReport = null;
        this.render();
      };
    });

    // 刷新数据按钮
    const refreshBtn = document.getElementById('refreshDataBtn');
    if(refreshBtn){
      refreshBtn.onclick = ()=>{
        if(this.isDataFresh){
          toast('数据已是最新（今天），无需刷新');
          return;
        }
        this.refreshData();
      };
    }
  }
};

/* ===== 模块切换 ===== */
const MODULES={
  plan:{title:'每日读写计划',render:()=>PlanModule.render(),tag:'阅读 · 写作 · 成长'},
  material:{title:'文笔素材库',render:()=>MaterialModule.render(),tag:'金句 · 灵感 · 积累'},
  imitate:{title:'文笔仿写练习',render:()=>ImitateModule.render(),tag:'模仿 · 创造 · 精进'},
  review:{title:'内容复盘',render:()=>ReviewModule.render(),tag:'数据 · 诊断 · 优化'},
  reading:{title:'阅读清单',render:()=>ReadingModule.render(),tag:'书单 · 进度 · 感悟'},
  research:{title:'选题研究',render:()=>TopicResearch.autoShow(),tag:'搜索 · 分析 · 洞察'}
};

function switchModule(name){
  if(!MODULES[name])return;
  App.currentModule=name;
  document.getElementById('pageTitle').textContent=MODULES[name].title;
  document.getElementById('headerTag').textContent=MODULES[name].tag;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.module===name);
  });
  MODULES[name].render();
  // 移动端关闭侧栏
  if(window.innerWidth<=768){
    document.getElementById('sidebar').classList.remove('show');
    document.getElementById('overlay').classList.remove('show');
  }
  document.getElementById('content').scrollTop=0;
}

function updateHeaderDate(){
  const d=new Date();
  const w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('headerDate').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${w}`;
}

/* ===== 侧栏交互 ===== */
function setupSidebar(){
  const sidebar=document.getElementById('sidebar');
  const overlay=document.getElementById('overlay');
  const navToggle=document.getElementById('navToggle');
  const menuBtn=document.getElementById('menuBtn');

  // 桌面端：展开/折叠
  navToggle.onclick=()=>{
    if(window.innerWidth>768){
      sidebar.classList.toggle('expanded');
    }
  };

  // 移动端：打开/关闭
  menuBtn.onclick=()=>{
    sidebar.classList.add('show');
    overlay.classList.add('show');
  };
  overlay.onclick=()=>{
    sidebar.classList.remove('show');
    overlay.classList.remove('show');
  };

  // 导航项点击
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick=()=>switchModule(el.dataset.module);
  });

  // 导出按钮
  document.getElementById('exportBtn').onclick = ()=>{
    MDExporter.download();
    toast('✅ Markdown 备份已下载');
  };
}

/* ===== 初始化 ===== */
function init(){
  updateHeaderDate();
  setupSidebar();
  MaterialModule.init();
  ImitateModule.init();
  ReviewModule.init();
  ReadingModule.init();
  TopicResearch.init();
  ExportReminder.init();
  // 默认渲染计划模块
  switchModule('plan');

  // 每分钟更新日期（跨天自动刷新）
  setInterval(()=>{
    const now=new Date();
    const cur=document.getElementById('headerDate').textContent;
    const newStr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
    if(!cur.startsWith(newStr)){
      updateHeaderDate();
      if(App.currentModule==='plan'&&PlanModule.currentDate===todayStr()){
        PlanModule.currentDate=todayStr();
        PlanModule.render();
      }
    }
  },60000);
}

document.addEventListener('DOMContentLoaded',init);
</script>
